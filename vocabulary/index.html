<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>單字2000活用練習 Unit 2 個人特徵</title>
<style>
body{margin:0;font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:#f5f6f8;color:#222;line-height:1.5}
header{background:#2f5d8a;color:#fff;padding:20px 16px;text-align:center}header h1{margin:0;font-size:1.5em}header p{margin:4px 0 0;opacity:.9}
main{max-width:960px;margin:0 auto;padding:12px}h2{border-left:5px solid #2f5d8a;padding-left:10px;margin:24px 0 12px}h2 small{color:#888;font-weight:normal;font-size:.6em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.num{background:#2f5d8a;color:#fff;border-radius:12px;padding:0 8px;font-size:.85em}
.word{font-size:1.35em;font-weight:700}.ipa{color:#666;font-family:"Lucida Sans Unicode","Arial Unicode MS",sans-serif}
.zh{margin:6px 0;color:#b5482a}.forms{display:flex;gap:12px;flex-wrap:wrap;font-size:.9em;color:#444}
.phrase{font-size:.9em;color:#2f6b3a;margin-top:4px}.ex{margin-top:8px;padding:8px;background:#f0f4f9;border-radius:6px}.tr{color:#666;font-size:.92em}
.say{border:none;background:none;padding:0 2px;margin:0 2px;cursor:pointer;font-size:.9em;line-height:1;opacity:.55;vertical-align:middle}.say:hover,.say:focus{opacity:1}
.ctl{margin-top:12px;display:flex;gap:8px;justify-content:center}.ctl button{border:none;border-radius:20px;padding:8px 18px;font-size:1em;cursor:pointer;background:#fff;color:#2f5d8a;font-weight:600}
.rate{margin-top:10px;font-size:.9em;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}.rate button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:14px;padding:3px 10px;cursor:pointer;font-size:.9em}.rate button.on{background:#fff;color:#2f5d8a;font-weight:700}
.card.playing,#srs-study.playing{outline:3px solid #f0a33a}
.tabs{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tabs button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:14px;padding:4px 14px;font-size:.95em;font-weight:600;cursor:pointer}
.tabs button:hover,.tabs button:focus{background:rgba(255,255,255,.18)}
html[data-view="srs"] #tab-srs,html:not([data-view="srs"]) #tab-list{background:#fff;color:#2f5d8a;font-weight:700}
html[data-view="srs"] #list-view,html[data-view="srs"] .ctl{display:none}
html:not([data-view="srs"]) #srs-view{display:none}
#srs-view,#srs-view *,#srs-view *::before,#srs-view *::after{box-sizing:border-box}
#srs-view [hidden]{display:none !important}
#srs-view{max-width:720px;margin:0 auto;padding:12px}
#srs-view .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
#srs-view .stat{background:#fff;border-radius:10px;padding:8px 4px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#srs-view .stat b{display:block;font-size:1.35em;color:#2f5d8a;font-variant-numeric:tabular-nums}
#srs-view .stat span{font-size:.75em;color:#666}
#srs-view .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#srs-view .seg,#srs-view .tools{display:flex;flex-wrap:wrap;gap:6px}
#srs-view .seg button,#srs-view .tools button,#srs-view .limit{border:1px solid #d5dbe3;background:#fff;color:#2f5d8a;border-radius:16px;padding:6px 10px;font-size:.9em;font-weight:600;cursor:pointer}
#srs-view .seg button.on{background:#2f5d8a;color:#fff;border-color:#2f5d8a}
#srs-view .limit{display:inline-flex;align-items:center;gap:6px;color:#444;cursor:default}
#srs-view .limit input{width:4.2em;font-size:16px;border:1px solid #d5dbe3;border-radius:8px;padding:4px 6px;color:#222}
#srs-view .tools{margin-left:auto}
#srs-view .msg{min-height:1.2em;margin:0 0 8px;color:#b5482a;font-size:.9em}
#srs-view .practice,#srs-view .done{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#srs-view .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#888;font-size:.85em}
#srs-view .prompt{margin:16px 0;font-size:2em;font-weight:700;text-align:center;overflow-wrap:anywhere}
#srs-view .prompt.lang-zh{font-size:1.45em;color:#b5482a}
#srs-view .prompt .say{font-size:.7em}
#srs-view .show{display:block;width:100%;margin-top:8px;border:none;border-radius:20px;padding:12px 18px;background:#2f5d8a;color:#fff;font-size:1.05em;font-weight:700;cursor:pointer;min-height:48px}
#srs-view .show:focus,#srs-view .grades button:focus{outline:3px solid #f0a33a}
#srs-view .answer{font-size:1.5em}
#srs-view .zh.answer{font-size:1.35em;font-weight:700}
#srs-view .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
#srs-view .grades button{border:none;border-radius:10px;padding:8px 4px;color:#fff;font-size:.95em;font-weight:700;cursor:pointer;min-height:64px}
#srs-view .grades .k{display:block;font-size:.72em;font-weight:600;opacity:.85}
#srs-view .grades small{display:block;margin-top:2px;font-size:.95em;font-weight:700}
#srs-view .grades .again{background:#b5482a}
#srs-view .grades .hard{background:#c47b14}
#srs-view .grades .good{background:#2f6b3a}
#srs-view .grades .easy{background:#2f5d8a}
#srs-view .done{padding:28px 16px;text-align:center}
#srs-view .done .lead{margin:0 0 8px;font-size:1.25em;font-weight:700}
#srs-view .done p{margin:6px 0}
#srs-view .hint{margin:10px 0 0;color:#888;font-size:.85em;text-align:center}
@media (max-width:560px){
  #srs-view .grades{grid-template-columns:repeat(2,1fr)}
  #srs-view .prompt{font-size:1.65em}
  #srs-view .prompt.lang-zh{font-size:1.25em}
  #srs-view .tools{margin-left:0}
}
.chunk-status{grid-column:1/-1;margin:0;color:#666}
.chunk-error{color:#b5482a}
#list-view,#srs-view{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
#to-top{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:44px;height:44px;border:none;border-radius:22px;background:#2f5d8a;color:#fff;font-size:1.25em;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#to-top[hidden]{display:none !important}
#play-stop{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));border:none;border-radius:22px;background:#2f5d8a;color:#fff;font-weight:700;font-size:.95em;line-height:1;padding:12px 16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}
#play-stop[hidden]{display:none !important}
@media (max-width:560px){
  #to-top{right:max(10px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:40px;height:40px}
  #play-stop{bottom:calc(10px + env(safe-area-inset-bottom));max-width:calc(100vw - 72px);padding:10px 14px}
}
</style>
<script>
(function(){
  var tab='list';
  try{
    var h=location.hash;
    if(h==='#srs'||h==='#list') tab=h.slice(1);
    else {
      var s=localStorage.getItem('vocabTab');
      if(s==='srs'||s==='list') tab=s;
    }
  }catch(e){}
  document.documentElement.setAttribute('data-view', tab);
})();
</script>

<body>
<button type="button" id="play-stop" hidden>■ Stop</button>
<button type="button" id="to-top" aria-label="回到頁頂" hidden>↑</button>
<header>
  <h1>單字2000活用練習</h1>
  <p>Unit 2 個人特徵 Personal characteristics</p>
  <div class="tabs" role="tablist" aria-label="檢視">
    <button type="button" role="tab" id="tab-list" aria-controls="list-view">單字列表</button>

  <div class="ctl"><button id="all" type="button">▶ Play All</button><button id="stop" type="button">■ Stop</button></div>

    <button type="button" data-r="0.5">0.5x</button>

      <button type="button" class="again" data-grade="again"><span class="k">1</span>Again<small></small></button>

      <button type="button" class="good" data-grade="good"><span class="k">3</span>Good<small></small></button>

    <p class="lead">這輪沒有待練習的卡片</p>

  <p class="hint">空白鍵顯示答案 · 數字鍵 1–4 評分</p>
</div>
<script src="data/manifest.js"></script>
<script>
(function(){
var S=window.speechSynthesis,voice=null,run=0,RATE=1;
try{var sr=parseFloat(localStorage.getItem('vocabRate'));if(sr>=0.5&&sr<=2)RATE=sr}catch(e){}
function setRate(r){RATE=r;document.body.dataset.rate=r;document.querySelectorAll('.rate button').forEach(function(b){b.classList.toggle('on',parseFloat(b.dataset.r)===r)});try{localStorage.setItem('vocabRate',r)}catch(e){}}
document.querySelectorAll('.rate button').forEach(function(b){b.addEventListener('click',function(){setRate(parseFloat(b.dataset.r))})});setRate(RATE);
function pick(){var v=S.getVoices().filter(function(x){return x.lang&&x.lang.replace('_','-').toLowerCase()==='en-us'});voice=v[0]||null}
if(S){pick();S.onvoiceschanged=pick}
function bindUtter(u){return new Promise(function(r){var id=run,done=false;function finish(){if(done)return;done=true;r()}var poll=setInterval(function(){if(id!==run){clearInterval(poll);finish()}},40);u.onend=u.onerror=function(){clearInterval(poll);finish()};u.rate=RATE;S.speak(u)})}
function utter(t){var u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;return bindUtter(u)}
var zhv=null;function pickZh(){var a=S.getVoices(),n=function(x){return (x.lang||'').replace('_','-').toLowerCase()};zhv=a.filter(function(x){return n(x)==='zh-tw'})[0]||a.filter(function(x){return n(x)==='zh-cn'})[0]||a.filter(function(x){return n(x).indexOf('zh')===0})[0]||null}
if(S){pickZh();S.addEventListener('voiceschanged',pickZh)}
function utterZh(t){var u=new SpeechSynthesisUtterance(t);u.lang=zhv?zhv.lang:'zh-TW';if(zhv)u.voice=zhv;return bindUtter(u)}
function wait(ms,id){return new Promise(function(r){var start=Date.now();(function tick(){if((id!=null&&id!==run)||Date.now()-start>=ms)r();else setTimeout(tick,40)})()})}
function mark(c){document.querySelectorAll('.card.playing,#srs-study.playing').forEach(function(x){x.classList.remove('playing')});if(c){c.classList.add('playing');c.scrollIntoView({behavior:'smooth',block:'center'})}}
function cardFields(c){return {word:c.dataset.word,zh:c.dataset.zh,ex:c.dataset.ex,tr:c.dataset.tr,el:c}}
async function playSequence(fields,id){if(fields.el)mark(fields.el);var steps=[function(){return utter(fields.word)},function(){return utterZh(fields.zh)},function(){return utter(fields.ex)},function(){return utterZh(fields.tr)}];for(var i=0;i<steps.length;i++){if(id!==run)return;await steps[i]();if(id!==run)return;if(i<steps.length-1)await wait(500,id)}}
function playOne(fields){stop();var id=run;setPlayStop(true);playSequence(fields,id).then(function(){if(id===run){mark(null);setPlayStop(false)}})}
window.VOCAB_PLAY_CARD=playOne
function setPlayStop(on, index, total){var b=document.getElementById('play-stop');if(!b)return;b.hidden=!on;if(!on)return;var label='■ Stop';if(index&&total)label+=' · '+index+'/'+total;b.textContent=label;b.setAttribute('aria-label',label)}
function stop(){run++;if(S)S.cancel();mark(null);setPlayStop(false)}
if(!S){alert('This browser does not support speech (Web Speech API).');return}
document.getElementById('list-view').addEventListener('click',async function(e){var b=e.target.closest&&e.target.closest('.say');if(!b)return;var c=b.closest('.card');if(!c)return;if(b.classList.contains('sc')){playOne(cardFields(c));return}stop();var id=run;mark(c);if(b.classList.contains('sz'))await utterZh(c.dataset.zh);else if(b.classList.contains('st'))await utterZh(c.dataset.tr);else await utter(b.classList.contains('sw')?c.dataset.word:c.dataset.ex);if(id===run)mark(null)});
document.getElementById('all').addEventListener('click',async function(){stop();var id=run;setPlayStop(true);try{if(window.VOCAB_ENSURE_ALL)await window.VOCAB_ENSURE_ALL()}catch(e){if(id===run)setPlayStop(false);return}if(id!==run)return;var cs=document.querySelectorAll('#list-view .card');for(var i=0;i<cs.length;i++){if(id!==run)return;setPlayStop(true,i+1,cs.length);await playSequence(cardFields(cs[i]),id);if(id!==run)return;await wait(1200,id)}if(id===run){mark(null);setPlayStop(false)}});
document.getElementById('stop').addEventListener('click',stop);
document.getElementById('play-stop').addEventListener('click',stop);
})();
</script>
<script>
(function () {
  window.VOCAB_CHUNKS = window.VOCAB_CHUNKS || {};
  window.VOCAB_REGISTER = function (id, words) {
    if (!id || !Array.isArray(words)) return;
    window.VOCAB_CHUNKS[id] = words;
  };

  var listEl = document.getElementById('list-view');
  var inflight = {};

  function manifest() {
    return window.VOCAB_MANIFEST || { books: [] };
  }

  function eachChunk(fn) {
    (manifest().books || []).forEach(function (book) {
      (book.units || []).forEach(function (unit) {
        (unit.chunks || []).forEach(function (chunk) {
          fn(book, unit, chunk);
        });
      });
    });
  }

  function chunkById(id) {
    var found = null;
    eachChunk(function (book, unit, chunk) {
      if (chunk.id === id) found = chunk;
    });
    return found;
  }

  function unitLine(unit) {
    if (unit.id === 'u2') return unit.title + ' Personal characteristics';
    return unit.title;
  }

  function paintHeader() {
    var books = manifest().books || [];
    if (!books.length) return;
    var h1 = document.querySelector('header h1');
    var sub = document.querySelector('header p');
    if (books.length === 1 && h1) h1.textContent = books[0].title;
    var units = books.length === 1 ? (books[0].units || []) : [];
    if (units.length === 1 && sub) sub.textContent = unitLine(units[0]);
    else if (books.length === 1 && units.length > 1 && sub) {
      sub.textContent = units.map(function (u) { return u.title; }).join(' · ');
    }
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function say(cls, label) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'say ' + cls;
    b.title = label;
    b.setAttribute('aria-label', label);
    b.textContent = '🔊';
    return b;
  }

  function cardAllButton() {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'say sc';
    b.title = 'Play card';
    b.setAttribute('aria-label', '全部朗讀');
    b.textContent = '▶';
    return b;
  }

  function renderCard(w) {
    var card = el('div', 'card');
    card.dataset.word = w.word || '';
    card.dataset.zh = w.speak_meaning || '';
    card.dataset.tr = w.speak_translation || '';
    card.dataset.ex = w.speak_sentence || '';

    var head = el('div', 'head');
    head.appendChild(el('span', 'num', String(w.num)));
    head.appendChild(el('span', 'word', w.word || ''));
    head.appendChild(say('sw', 'Play word'));
    head.appendChild(cardAllButton());
    head.appendChild(el('span', 'ipa', w.phonetics || ''));
    card.appendChild(head);

    var zh = el('div', 'zh');
    zh.appendChild(document.createTextNode((w.chinese_meaning || '') + ' '));
    zh.appendChild(say('sz', 'Play meaning'));
    card.appendChild(zh);

    if (w.comparative || w.superlative) {
      var forms = el('div', 'forms');
      if (w.comparative) {
        var c = el('span');
        c.appendChild(document.createTextNode('比較級 '));
        c.appendChild(el('b', null, w.comparative));
        forms.appendChild(c);
      }
      if (w.superlative) {
        var s = el('span');
        s.appendChild(document.createTextNode('最高級 '));
        s.appendChild(el('b', null, w.superlative));
        forms.appendChild(s);
      }
      card.appendChild(forms);
    }
    if (w.phrase) card.appendChild(el('div', 'phrase', '片語：' + w.phrase));

    var ex = el('div', 'ex');
    var en = el('div', 'en');
    en.appendChild(document.createTextNode((w.example_sentence || '') + ' '));
    en.appendChild(say('ss', 'Play sentence'));
    var tr = el('div', 'tr');
    tr.appendChild(document.createTextNode((w.example_translation || '') + ' '));
    tr.appendChild(say('st', 'Play translation'));
    ex.appendChild(en);
    ex.appendChild(tr);
    card.appendChild(ex);
    return card;
  }

  function sectionOf(id) {
    return listEl.querySelector('[data-chunk="' + id + '"]');
  }

  function setStatus(section, text, isError) {
    var grid = section.querySelector('.grid');
    grid.textContent = '';
    var p = el('p', 'chunk-status' + (isError ? ' chunk-error' : ''), text);
    grid.appendChild(p);
    section.removeAttribute('data-state');
    section.setAttribute('aria-busy', isError ? 'false' : 'true');
  }

  function renderWords(section, words) {
    var grid = section.querySelector('.grid');
    grid.textContent = '';
    words.forEach(function (w) { grid.appendChild(renderCard(w)); });
    section.setAttribute('data-state', 'ready');
    section.setAttribute('aria-busy', 'false');
  }

  function loadScript(chunk) {
    if (window.VOCAB_CHUNKS[chunk.id]) return Promise.resolve(window.VOCAB_CHUNKS[chunk.id]);
    if (inflight[chunk.id]) return inflight[chunk.id];
    inflight[chunk.id] = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      try {
        s.src = new URL(chunk.file, document.baseURI).href;
      } catch (e) {
        s.src = chunk.file;
      }
      s.async = true;
      s.charset = 'utf-8';
      var timer = setTimeout(function () {
        s.onload = s.onerror = null;
        reject(new Error('timeout'));
      }, 20000);
      s.onload = function () {
        clearTimeout(timer);
        var data = window.VOCAB_CHUNKS[chunk.id];
        if (!data) reject(new Error('empty'));
        else resolve(data);
      };
      s.onerror = function () {
        clearTimeout(timer);

      paintDone();
      return;
    }
    var word = q[0];
    var card = ensure(word);
    if (isNew(card) && !card.introduced) {
      card.introduced = dayKey(now);
      save();
    }
    active = { word: word, dir: chooseDir(), revealed: false };
    paintCard();
    paintStats();
  }

  function reveal() {
    if (!active || active.revealed) return;
    active.revealed = true;
    paintCard();
  }

  function grade(rating) {
    if (!srsOn() || !active || !active.revealed) return;
    if (S) { try { S.cancel(); } catch (e) {} }
    var word = active.word;
    state.cards[word] = schedule(ensure(word), rating, Date.now());
    save();
    el.msg.textContent = '';
    active = null;
    showNext();
  }

  function applyTab(tab, opts) {
    opts = opts || {};
    if (tab !== 'srs') tab = 'list';
    var was = document.documentElement.getAttribute('data-view');
    document.documentElement.setAttribute('data-view', tab);
    try { localStorage.setItem(TAB_KEY, tab); } catch (e) {}
    var onSrs = tab === 'srs';
    el.tabList.setAttribute('aria-selected', onSrs ? 'false' : 'true');
    el.tabSrs.setAttribute('aria-selected', onSrs ? 'true' : 'false');
    el.list.setAttribute('aria-hidden', onSrs ? 'true' : 'false');
    el.srs.setAttribute('aria-hidden', onSrs ? 'false' : 'true');
    if (!opts.skipHash) {
      var want = '#' + tab;
      if (location.hash !== want) history.replaceState(null, '', want);
    }
    if (onSrs && was !== 'srs') {
      var stopBtn = document.getElementById('stop');
      if (stopBtn) stopBtn.click();
    }
    if (onSrs) {
      ensureDeck().then(function () {
        if (!srsOn()) return;
        if (!active) showNext();
        else {
          paintStats();
          paintDirection();
          paintCard();
        }
      }).catch(function () {});
    }
  }

  el.show.addEventListener('click', reveal);
  el.grades.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.grade) return;
    grade(b.dataset.grade);
  });
  document.querySelector('#srs-view .seg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.dir) return;
    state.direction = b.dataset.dir;
    save();
    paintDirection();
    if (active && !active.revealed) {
      active.dir = chooseDir();
      paintCard();
    }
  });
  el.perDay.addEventListener('change', function () {
    var n = Number(el.perDay.value);
    if (!isFinite(n)) {
      el.perDay.value = String(state.newPerDay);
      return;
    }
    state.newPerDay = Math.max(0, Math.min(999, Math.round(n)));
    el.perDay.value = String(state.newPerDay);
    save();
    if (!srsOn()) return;
    if (active) paintCard();
    else showNext();
  });

  document.getElementById('srs-export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2) + '\n'], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vocabSRS_v1.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    el.msg.textContent = '';
  });
  document.getElementById('srs-import').addEventListener('click', function () {
    document.getElementById('srs-file').click();
  });
  document.getElementById('srs-file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var raw = JSON.parse(String(reader.result));
        if (!raw || typeof raw !== 'object' || Array.isArray(raw) || !raw.cards || typeof raw.cards !== 'object') {
          throw new Error('bad shape');
        }
        var next = defaultState();
        var n = Number(raw.newPerDay);
        if (isFinite(n)) next.newPerDay = Math.max(0, Math.min(999, Math.round(n)));
        if (raw.direction === 'zh' || raw.direction === 'mixed' || raw.direction === 'en') next.direction = raw.direction;
        Object.keys(raw.cards).forEach(function (word) {
          next.cards[word] = clampCard(raw.cards[word]);
        });
        state = next;
        save();
        active = null;
        el.msg.textContent = '已匯入進度。';
        if (srsOn()) showNext();
        else paintStats();
      } catch (err) {
        el.msg.textContent = '無法匯入這個檔案。請選擇先前匯出的 JSON。';
      }
    };
    reader.readAsText(file);
  });
  document.getElementById('srs-reset').addEventListener('click', function () {
    if (!confirm('Reset progress?\n這會清除本機的 SRS 進度，無法復原。')) return;
    state = defaultState();
    save();
    active = null;
    el.msg.textContent = '進度已重設。';
    if (srsOn()) showNext();
    else paintStats();
  });

  el.srs.addEventListener('click', function (e) {
    var b = e.target.closest('.say');
    if (!b || !active) return;
    if (b.classList.contains('sc') || b.dataset.say === 'card') {
      var entry = byWord[active.word];
      if (!entry || typeof window.VOCAB_PLAY_CARD !== 'function') return;
      window.VOCAB_PLAY_CARD({
        word: entry.word,
        zh: entry.speak_meaning || entry.chinese_meaning,
        ex: entry.speak_sentence || entry.example_sentence,
        tr: entry.speak_translation || entry.example_translation,
        el: el.study
      });
      return;
    }
    speakPart(byWord[active.word], b.dataset.say);
  });

  el.tabList.addEventListener('click', function () { applyTab('list'); });
  el.tabSrs.addEventListener('click', function () { applyTab('srs'); });
  window.addEventListener('hashchange', function () {
    if (location.hash === '#srs' || location.hash === '#list') applyTab(location.hash.slice(1), { skipHash: true });
  });

  document.addEventListener('keydown', function (e) {
    if (!srsOn()) return;
    if (e.target && e.target.closest && e.target.closest('input, textarea, select')) return;
    if (e.key === ' ' || e.code === 'Space') {
      if (e.target && e.target.closest && e.target.closest('button, a, .tabs, .rate')) return;
      e.preventDefault();
      if (active && !active.revealed) reveal();
      return;
    }
    if (e.repeat || !active || !active.revealed) return;
    var map = { '1': 'again', '2': 'hard', '3': 'good', '4': 'easy' };
    if (map[e.key]) {
      e.preventDefault();
      grade(map[e.key]);
    }
  });

  setInterval(function () {
    if (!srsOn() || !deckReady) return;
    if (!active) showNext();
    else paintStats();
  }, 1000);

  applyTab(document.documentElement.getAttribute('data-view') || 'list', { skipHash: true });
})();
</script>
<script>
(function(){
  var btn=document.getElementById('to-top');
  function sync(){var show=window.scrollY>300;btn.hidden=!show}
  window.addEventListener('scroll',sync,{passive:true});
  window.addEventListener('resize',sync);
  btn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
  sync();
})();
</script>
</body>
