<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>單字2000活用練習 Unit 2 個人特徵</title>
<style>
body{margin:0;font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:#f5f6f8;color:#222;line-height:1.5}
header{background:#2f5d8a;color:#fff;padding:20px 16px;text-align:center}header h1{margin:0;font-size:1.5em}header p{margin:4px 0 0;opacity:.9}
main{max-width:960px;margin:0 auto;padding:12px}h2{border-left:5px solid #2f5d8a;padding-left:10px;margin:24px 0 12px}h2 small{color:#888;font-weight:normal;font-size:.6em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{position:relative;background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.num{background:#2f5d8a;color:#fff;border-radius:12px;padding:0 8px;font-size:.85em}
.head-break{flex-basis:100%;height:0}
.word{font-size:clamp(1.5rem, 1.15rem + 1.1vw, 1.9rem);font-weight:700;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.syl{font-size:.95rem;font-weight:500;line-height:1.35;color:#6d7580;letter-spacing:.01em}
.syl b{font-weight:800;color:#2f5d8a}
.ipa{color:#666;font-family:"Lucida Sans Unicode","Arial Unicode MS",sans-serif}
.zh{margin:6px 0;color:#b5482a}.forms{display:flex;gap:12px;flex-wrap:wrap;font-size:.9em;color:#444}
.phrase{font-size:.9em;color:#2f6b3a;margin-top:4px}.ex{margin-top:8px;padding:8px;background:#f0f4f9;border-radius:6px}.tr{color:#666;font-size:.92em}
.ex mark.hw{background:#ffe9a8;color:inherit;font-weight:700;border-radius:3px;padding:0 2px}
.ex mark.also{background:transparent;color:#3d6b8a;font-weight:600;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.ex .coloc.prep{border-radius:4px;padding:0 1px;background-color:transparent;transition:background-color .28s ease;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ex .coloc.prep.on{background-color:#fff3cc}
.ex .coloc.prep mark.hw{border-radius:3px 0 0 3px;padding:0 1px 0 2px}
.ex .coloc.prep mark.prep{background:transparent;color:inherit;font-weight:600;border-radius:0 3px 3px 0;padding:0 2px 0 0}
.ex .coloc.phrase{padding:0 2px 1px;background-color:transparent;border-bottom:2px solid transparent;box-shadow:inset 1.5px 0 0 transparent,inset -1.5px 0 0 transparent;transition:background-color .28s ease,border-color .28s ease,box-shadow .28s ease;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ex .coloc.phrase.on{background-color:rgba(47,107,58,.1);border-bottom-color:#2a7a45;box-shadow:inset 1.5px 0 0 #2a7a45,inset -1.5px 0 0 #2a7a45}
.ex .coloc.phrase mark.hw{border-radius:3px}
.ex .coloc .linkdot{display:inline-block;width:.38em;height:.38em;margin-left:1px;border-radius:50%;background:#2a7a45;vertical-align:super;opacity:0;transition:opacity .28s ease}
.ex .coloc.on .linkdot{opacity:1}
.coloc-cap{margin:4px 0 0;color:#5c4d78;font-size:.88em;line-height:1.4;max-height:0;opacity:0;overflow:hidden;transition:opacity .28s ease,max-height .28s ease}
.coloc-cap.show{max-height:2.8em;opacity:1}
.coloc-chip{border:none;border-radius:999px;padding:3px 8px;font-size:.75em;line-height:1.45;cursor:pointer;background:#f3eef8;color:#6b3a7a}
.coloc-chip.phrase{background:#e7f6ee;color:#2f6b3a}
.coloc-chip[aria-pressed="true"]{outline:2px solid currentColor}
#srs-ex mark.also{cursor:help}
.card.flash{animation:cardflash 1.2s ease}
@keyframes cardflash{0%{box-shadow:0 0 0 3px #f0a33a}100%{box-shadow:0 1px 3px rgba(0,0,0,.1)}}
.also{margin-top:8px;font-size:.88em;color:#444}
.also summary{cursor:pointer;color:#2f5d8a;font-weight:600}
.also li{margin:6px 0}
.also-src{border:none;background:none;padding:0;color:#2f5d8a;font-weight:700;cursor:pointer}
.say{border:none;background:none;padding:0 2px;margin:0 2px;cursor:pointer;font-size:.9em;line-height:1;opacity:.55;vertical-align:middle}.say:hover,.say:focus{opacity:1}
.card>.sc,#srs-back>.sc{position:absolute;top:6px;right:6px;z-index:2;box-sizing:border-box;width:40px;height:40px;min-width:40px;min-height:40px;margin:0;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:1.15em;opacity:.8}
.card>.head,#srs-back>.head{padding-right:52px;min-height:40px}
#srs-back{position:relative}
#filter-bar{max-width:960px;margin:0 auto;padding:8px 12px 0}
html[data-view="srs"] #filter-bar{display:none}
.fgroup{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;margin:4px 0}
.flabel{flex:0 0 auto;min-width:4.2em;padding-top:5px;color:#666;font-size:.78em}
.fchips{display:flex;flex-wrap:wrap;gap:4px}
.tag,.fchips button{border:none;border-radius:999px;padding:3px 8px;font-size:.75em;line-height:1.45;cursor:pointer;background:#eef1f4;color:#333}
.tag.letter,.fchips button.letter{background:#e7f0f8;color:#2f5d8a}
.tag.page,.fchips button.page{background:#f4f1ea;color:#6b542a}
.tag.affix,.fchips button.affix{background:#e7f6ee;color:#2f6b3a}
.tag.comparison,.fchips button.comparison{background:#fdeee8;color:#b5482a}
.tag.colloc,.fchips button.colloc{background:#f3eef8;color:#6b3a7a}
.tag.note,.tag.note:disabled{background:#f7f1e6;color:#6b542a;cursor:default;opacity:1}
.fsub{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1}
.fsublabel{color:#888;font-size:.75em;margin:0 2px 0 4px}
.tag.on,.fchips button.on{outline:2px solid currentColor}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-right:44px}
.card.filtered-out{display:none}
#filter-active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:.85em}
#filter-active button{border:1px solid #d5dbe3;background:#fff;color:#2f5d8a;border-radius:14px;padding:3px 8px;cursor:pointer;font-weight:600}
#filter-count{margin:4px 0 0;color:#666;font-size:.85em}
.ctl{margin-top:12px;display:flex;gap:8px;justify-content:center}.ctl button{border:none;border-radius:20px;padding:8px 18px;font-size:1em;cursor:pointer;background:#fff;color:#2f5d8a;font-weight:600}
.rate{margin-top:10px;font-size:.9em;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}.rate button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:14px;padding:3px 10px;cursor:pointer;font-size:.9em}.rate button.on{background:#fff;color:#2f5d8a;font-weight:700}
.card.playing,#srs-study.playing{outline:3px solid #f0a33a}
.tabs{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tabs button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:14px;padding:4px 14px;font-size:.95em;font-weight:600;cursor:pointer}
.tabs button:hover,.tabs button:focus{background:rgba(255,255,255,.18)}
html[data-view="srs"] #tab-srs,html:not([data-view="srs"]) #tab-list{background:#fff;color:#2f5d8a;font-weight:700}
html[data-view="srs"] #list-view,html[data-view="srs"] .ctl{display:none}
html:not([data-view="srs"]) #srs-view{display:none}
#srs-view,#srs-view *,#srs-view *::before,#srs-view *::after{box-sizing:border-box}
#srs-view [hidden]{display:none !important}
#srs-view{max-width:720px;margin:0 auto;padding:12px}
#srs-view .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
#srs-view .stat{background:#fff;border-radius:10px;padding:8px 4px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#srs-view .stat b{display:block;font-size:1.35em;color:#2f5d8a;font-variant-numeric:tabular-nums}
#srs-view .stat span{font-size:.75em;color:#666}
#srs-view .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
#srs-view .seg,#srs-view .tools{display:flex;flex-wrap:wrap;gap:6px}
#srs-view .seg button,#srs-view .tools button,#srs-view .limit{border:1px solid #d5dbe3;background:#fff;color:#2f5d8a;border-radius:16px;padding:6px 10px;font-size:.9em;font-weight:600;cursor:pointer}
#srs-view .seg button.on{background:#2f5d8a;color:#fff;border-color:#2f5d8a}
#srs-view .limit{display:inline-flex;align-items:center;gap:6px;color:#444;cursor:default}
#srs-view .limit input{width:4.2em;font-size:16px;border:1px solid #d5dbe3;border-radius:8px;padding:4px 6px;color:#222}
#srs-view .autoplay{cursor:pointer}
#srs-view .autoplay input{width:1.05em;height:1.05em;padding:0}
#srs-view .tools{margin-left:auto}
#srs-view .msg{min-height:1.2em;margin:0 0 8px;color:#b5482a;font-size:.9em}
#srs-view .practice,#srs-view .done{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#srs-view .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#888;font-size:.85em}
#srs-view .prompt{margin:16px 0;font-size:2em;font-weight:700;text-align:center;overflow-wrap:anywhere}
#srs-view .prompt .word{font-size:clamp(2.15rem, 1.85rem + 1.5vw, 2.6rem);font-weight:700;line-height:1.15}
#srs-view .prompt .syl{display:block;margin-top:4px;font-size:1.05rem;font-weight:500;line-height:1.35}
#srs-view #srs-word.word{font-size:clamp(1.5rem, 1.15rem + 1.1vw, 1.9rem)}
#srs-back>.syl{margin:8px 0 0;padding-right:52px}
#srs-tags{padding-right:0;margin-top:8px}
#srs-cloze{margin:8px 0 12px}
#srs-cloze .kind{margin:0 0 6px;color:#888;font-size:.85em;text-align:center}
#srs-cloze .sent{margin:0;font-size:1.15rem;line-height:1.65;text-align:center}
#srs-cloze .blank{display:inline-block;min-width:2.4em;border-bottom:2px solid #2f5d8a;text-align:center}
#srs-cloze .hint{margin:8px 0 0;color:#666;font-size:.95rem;text-align:center}
#srs-cloze .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#srs-cloze .choices button{min-height:48px;padding:8px 10px;border:1px solid #d5dbe3;border-radius:10px;background:#fff;color:#2f5d8a;font-size:1.05rem;font-weight:700;cursor:pointer}
#srs-cloze .choices button:focus{outline:3px solid #f0a33a}
#srs-cloze form{display:flex;gap:8px;margin-top:12px}
#srs-cloze input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:1px solid #d5dbe3;border-radius:10px;color:#222}
#srs-cloze form button,#srs-cloze .reveal-btn{font-size:16px;min-height:48px;padding:0 14px;border:none;border-radius:10px;background:#2f5d8a;color:#fff;font-weight:700;cursor:pointer}
#srs-cloze .result{margin:10px 0 0;text-align:center;font-weight:700}
#srs-cloze .result.ok{color:#2f6b3a}
#srs-cloze .result.bad{color:#b5482a}
#srs-view .grades button.suggest{outline:3px solid #f0a33a;outline-offset:2px}
#srs-cloze .choices button.miss{border-color:#b5482a;color:#b5482a}
#srs-autograde{height:5px;margin-top:8px;background:#e6ebf2;border-radius:3px;overflow:hidden}
#srs-autograde .bar{height:100%;width:100%;background:#2f5d8a;transform-origin:left center}
#srs-autograde.run .bar{animation:srs-autograde 1.5s linear forwards}
@keyframes srs-autograde{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#srs-cloze-mode{font-size:16px;border:1px solid #d5dbe3;border-radius:8px;padding:4px 6px;color:#222;background:#fff}
#srs-view .prompt.lang-zh{font-size:1.45em;color:#b5482a}
#srs-view .prompt .say{font-size:.7em}
#srs-view .show{display:block;width:100%;margin-top:8px;border:none;border-radius:20px;padding:12px 18px;background:#2f5d8a;color:#fff;font-size:1.05em;font-weight:700;cursor:pointer;min-height:48px}
#srs-view .show:focus,#srs-view .grades button:focus{outline:3px solid #f0a33a}
#srs-view .answer{font-size:1.5em}
#srs-view .zh.answer{font-size:1.35em;font-weight:700}
#srs-view .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
#srs-view .grades button{border:none;border-radius:10px;padding:8px 4px;color:#fff;font-size:.95em;font-weight:700;cursor:pointer;min-height:64px}
#srs-view .grades .k{display:block;font-size:.72em;font-weight:600;opacity:.85}
#srs-view .grades small{display:block;margin-top:2px;font-size:.95em;font-weight:700}
#srs-view .grades .again{background:#b5482a}
#srs-view .grades .hard{background:#c47b14}
#srs-view .grades .good{background:#2f6b3a}
#srs-view .grades .easy{background:#2f5d8a}
#srs-view .done{padding:28px 16px;text-align:center}
#srs-view .done .lead{margin:0 0 8px;font-size:1.25em;font-weight:700}
#srs-view .done p{margin:6px 0}
#srs-view .bonus{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
#srs-view .bonus button{border:1px solid #d5dbe3;background:#fff;color:#2f5d8a;border-radius:16px;padding:8px 12px;font-weight:700;cursor:pointer}
#srs-view .bonus button.cram{background:#2f5d8a;color:#fff;border-color:#2f5d8a}
#srs-view .bonus button[hidden]{display:none !important}
#srs-view .cram-tag{color:#b5482a;font-weight:700}
#srs-view .hint{margin:10px 0 0;color:#888;font-size:.85em;text-align:center}
@media (max-width:560px){
  #srs-view .grades{grid-template-columns:repeat(2,1fr)}
  #srs-view .prompt{font-size:1.65em}
  #srs-view .prompt.lang-zh{font-size:1.25em}
  #srs-view .tools{margin-left:0}
}
.chunk-status{grid-column:1/-1;margin:0;color:#666}
.chunk-error{color:#b5482a}
#list-view,#srs-view{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
#to-top{position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:44px;height:44px;border:none;border-radius:22px;background:#2f5d8a;color:#fff;font-size:1.25em;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#to-top[hidden]{display:none !important}
#play-stop{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));border:none;border-radius:22px;background:#2f5d8a;color:#fff;font-weight:700;font-size:.95em;line-height:1;padding:12px 16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}
#play-stop[hidden]{display:none !important}
@media (max-width:560px){
  #to-top{right:max(10px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:40px;height:40px}
  #play-stop{bottom:calc(10px + env(safe-area-inset-bottom));max-width:calc(100vw - 72px);padding:10px 14px}
}
</style>
<script>
(function(){
  var tab='list';
  try{
    var h=location.hash;
    var body=h.replace(/^#/,'');
    if(body==='srs'||body.indexOf('srs/')===0) tab='srs';
    else if(body==='list'||body.indexOf('list/')===0) tab='list';
    else {
      var s=localStorage.getItem('vocabTab');
      if(s==='srs'||s==='list') tab=s;
    }
  }catch(e){}
  document.documentElement.setAttribute('data-view', tab);
})();
</script>
</head>
<body>
<button type="button" id="play-stop" hidden>■ Stop</button>
<button type="button" id="to-top" aria-label="回到頁頂" hidden>↑</button>
<header>
  <h1>單字2000活用練習</h1>
  <p>Unit 2 個人特徵 Personal characteristics</p>
  <div class="tabs" role="tablist" aria-label="檢視">
    <button type="button" role="tab" id="tab-list" aria-controls="list-view">單字列表</button>
    <button type="button" role="tab" id="tab-srs" aria-controls="srs-view">SRS 練習</button>
  </div>
  <div class="ctl"><button id="all" type="button">▶ Play All</button><button id="stop" type="button">■ Stop</button></div>
  <div class="rate" role="group" aria-label="Speech rate">速度
    <button type="button" data-r="0.5">0.5x</button>
    <button type="button" data-r="0.75">0.75x</button>
    <button type="button" data-r="1" class="on">1x</button>
    <button type="button" data-r="1.25">1.25x</button>
  </div>
</header>
<div id="filter-bar">
  <div class="fgroup"><span class="flabel">頁碼</span><div class="fchips" data-kind="page"></div></div>
  <div class="fgroup"><span class="flabel">字首字母</span><div class="fchips" data-kind="letter"></div></div>
  <div class="fgroup"><span class="flabel">字根字首</span><div class="fchips" data-kind="affix"></div></div>
  <div class="fgroup"><span class="flabel">比較級</span><div class="fchips" data-kind="comparison"></div></div>
  <div class="fgroup"><span class="flabel">搭配詞</span><div class="fchips" data-kind="colloc" data-sub="prep"></div></div>
  <div id="filter-active"></div>
  <p id="filter-count"></p>
</div>
<main id="list-view"></main>
<div id="srs-view" aria-labelledby="tab-srs">
  <div class="stats" aria-label="SRS 統計">
    <div class="stat" title="今天到期或逾期的卡片"><b id="srs-due">0</b><span>今日到期</span></div>
    <div class="stat" title="還沒評過分的卡片"><b id="srs-new">0</b><span>新卡</span></div>
    <div class="stat" title="間隔短於 1 天，含重來"><b id="srs-learning">0</b><span>學習中</span></div>
    <div class="stat" title="間隔 21 天以上"><b id="srs-mature">0</b><span>成熟</span></div>
  </div>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="練習方向">
      <button type="button" id="srs-dir-en" data-dir="en">English → 中文</button>
      <button type="button" id="srs-dir-zh" data-dir="zh">中文 → English</button>
      <button type="button" id="srs-dir-mixed" data-dir="mixed">Mixed</button>
    </div>
    <label class="limit">每日新卡
      <input id="srs-limit" type="number" min="0" max="999" step="1" inputmode="numeric" aria-label="New cards per day">
    </label>
    <label class="limit autoplay"><input id="srs-autoplay" type="checkbox" checked> 翻開自動朗讀</label>
    <label class="limit cloze-on"><input id="srs-cloze-on" type="checkbox" checked> 例句挖空練習</label>
    <label class="limit autograde"><input id="srs-autograde-on" type="checkbox" checked> 自動評分</label>
    <label class="limit">題型
      <select id="srs-cloze-mode" aria-label="題型">
        <option value="auto">自動</option>
        <option value="choice">選擇題</option>
        <option value="type">填空</option>
      </select>
    </label>
    <div class="tools">
      <button type="button" id="srs-export" aria-label="Export progress">匯出進度</button>
      <button type="button" id="srs-import" aria-label="Import progress">匯入進度</button>
      <input id="srs-file" type="file" accept="application/json,.json" hidden>
      <button type="button" id="srs-reset" aria-label="Reset progress">重設進度</button>
    </div>
  </div>
  <p id="srs-msg" class="msg" role="status"></p>
  <section id="srs-study" class="practice" hidden>
    <div class="meta"><span id="srs-meta"></span><span id="srs-remain"></span></div>
    <div id="srs-prompt" class="prompt"></div>
    <div id="srs-cloze" hidden>
      <p id="srs-cloze-kind" class="kind"></p>
      <p id="srs-cloze-sent" class="sent"></p>
      <p id="srs-cloze-hint" class="hint"></p>
      <div id="srs-cloze-choices" class="choices"></div>
      <form id="srs-cloze-form">
        <input id="srs-cloze-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="填空答案">
        <button type="submit" id="srs-cloze-go">送出</button>
      </form>
      <p id="srs-cloze-result" class="result" hidden></p>
    </div>
    <button type="button" id="srs-show" class="show" aria-label="Show answer">顯示答案</button>
    <div id="srs-back" hidden>
      <div class="head"><span id="srs-word" class="word"></span></div>
      <div id="srs-syl" class="syl" hidden></div>
      <div id="srs-ipa" class="ipa"></div>
      <div id="srs-zh" class="zh"></div>
      <div id="srs-forms" class="forms"></div>
      <div id="srs-phrase" class="phrase"></div>
      <div class="ex">

<script>
(function () {

  function extraPhrases(value) {
    if (!value) return [];

  }

  function inflections(word) {
    var w = String(word || '').toLowerCase();
    var out = [];
    function push(s) { if (s && out.indexOf(s) === -1) out.push(s); }
    push(w);
    if (!w || /[\s-]/.test(w)) return out;
    var vowels = 'aeiou';
    if (/(?:[sxz]|[cs]h)$/.test(w)) push(w + 'es');

      var yi = w.slice(0, -1) + 'i';
      push(yi + 'er');
      push(yi + 'est');
      push(yi + 'ed');
      push(yi + 'ly');
    }
    if (/[^e]e$/.test(w) && w.length > 2) {
      var stem = w.slice(0, -1);
      push(stem + 'ing');
      push(stem + 'er');
      push(stem + 'est');
      push(w + 'd');
      push(w + 'r');
    }
    if (/[aeiou][^aeiouwxy]$/.test(w) && w.length <= 5) {
      var dbl = w + w.slice(-1);
      push(dbl + 'er');
      push(dbl + 'est');
      push(dbl + 'ed');
      push(dbl + 'ing');
    }
    push(w + 'er');
    push(w + 'est');
    push(w + 'ed');
    push(w + 'ing');
    push(w + 'ly');
    if (/y$/.test(w)) push(w.slice(0, -1) + 'ily');
    return out;
  }

  function phraseList(entry) {
    var phrases = [];
    function add(p) {
      p = String(p || '').trim();
      if (p && phrases.indexOf(p.toLowerCase()) === -1) phrases.push(p);
    }
    if (!entry) return phrases;
    add(entry.word);
    extraPhrases(entry.comparative).forEach(add);
    extraPhrases(entry.superlative).forEach(add);
    inflections(entry.word).forEach(add);
    if (entry.word && entry.word.indexOf(' ') === -1 && entry.word.indexOf('-') === -1) {
      add('more ' + entry.word);
      add('most ' + entry.word);
    }
    phrases.sort(function (a, b) { return b.length - a.length; });
    return phrases;
  }

  function findRanges(text, phrases) {
    if (!phrases.length || !text) return [];
    var pattern = phrases.map(function (p) {
      return p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
    }).join('|');
    var re = new RegExp('\\b(?:' + pattern + ')\\b', 'gi');
    var ranges = [];
    var match;
    while ((match = re.exec(text))) {
      if (!match[0]) { re.lastIndex++; continue; }
      ranges.push({ start: match.index, end: match.index + match[0].length, text: match[0] });
    }
    return ranges;
  }

  function overlapsRange(a, b) {
    return a.start < b.end && b.start < a.end;
  }

  function allEntries() {
    var list = [];
    Object.keys(window.VOCAB_CHUNKS || {}).forEach(function (id) {
      (window.VOCAB_CHUNKS[id] || []).forEach(function (w) { list.push(w); });
    });
    return list;
  }

  function srsCards() {
    try {
      var raw = JSON.parse(localStorage.getItem('vocabSRS_v1') || '{}');
      return raw && raw.cards ? raw.cards : {};
    } catch (e) { return {}; }
  }

  function isReviewedCard(card) {
    return !!(card && (card.repetitions > 0 || card.lapses > 0 || card.interval > 0 || card.due != null));

    var cards = srsCards();
    return allEntries().filter(function (w) { return isReviewedCard(cards[w.word]); });

    eachChunk(function (book, unit, chunk) {

    });
    return ok;
  }

  function wordMeta(id) {
    var idx = window.VOCAB_SENTENCE_INDEX;
    if (idx && idx.words && idx.words[id]) return idx.words[id];
    var loaded = null;
    allEntries().some(function (w) {
      if (w.id === id) { loaded = w; return true; }
    });
    return loaded ? { word: loaded.word, meaning: loaded.chinese_meaning || '', chunk: '' } : null;
  }

  function findEntryById(id) {
    var found = null;

  }

  function findLiteral(text, needle, from) {
    var n = String(needle || '');

    var i = text.toLowerCase().indexOf(n.toLowerCase(), from || 0);

    return { start: i, end: i + n.length, text: text.slice(i, i + n.length) };
  }

  function colocParts(entry, text) {
    var out = [];
    var list = (entry && entry.collocations) || [];
    var linkN = 0;
    list.forEach(function (c, ci) {
      if (!c) return;
      var parts = Array.isArray(c.match) ? c.match : [c.match];
      if (!parts.length || parts.some(function (p) { return !p; })) return;
      var found = [];
      var from = 0;
      for (var i = 0; i < parts.length; i++) {
        var hit = findLiteral(text, parts[i], from);
        if (!hit) return;
        found.push(hit);
        from = hit.end;
      }
      var link = parts.length > 1 ? String(++linkN) : '';
      found.forEach(function (hit, pi) {
        out.push({
          start: hit.start,
          end: hit.end,
          kind: c.kind === 'prep' ? 'prep' : 'phrase',
          zh: c.zh || c.text || '',
          link: link,
          group: 'c' + ci + 'p' + pi
        });
      });
    });
    return out;
  }

  function markSentence(parent, sentence, entry, opts) {
    opts = opts || {};
    var text = sentence || '';
    var primary = findRanges(text, phraseList(entry)).map(function (r) {
      return { start: r.start, end: r.end, text: r.text, kind: 'hw' };
    });
    var colocs = [];
    if (!opts.onlyThisWord && typeof opts.colocIndex === 'number') {

    }
    var marks = primary.slice();
    if (!opts.onlyThisWord) {
      function pushAlso(r, word, meaning) {
        var item = { start: r.start, end: r.end, text: r.text, kind: 'also', word: word, meaning: meaning || '' };
        if (primary.some(function (p) { return overlapsRange(p, item); })) return;
        if (colocs.some(function (p) { return overlapsRange(p, item); })) return;

          });
        });
      } else {
        reviewedEntries().forEach(function (other) {
          if (!other || other.word === (entry && entry.word)) return;

          });
        });
      }
    }
    var points = [0, text.length];
    primary.forEach(function (r) { points.push(r.start, r.end); });
    colocs.forEach(function (r) { points.push(r.start, r.end); });
    marks.forEach(function (r) { if (r.kind === 'also') points.push(r.start, r.end); });

    var pieces = [];
    for (var pi = 0; pi < points.length - 1; pi++) {

      var coloc = null;

      var also = null;
      if (!hw && !coloc) {

      }

    }
    var open = null;
    var wrap = null;

          wrap.title = p.coloc.zh || '';

        }

        mark.textContent = p.text;

    'be on a diet': 'on',

    'Be careful when …': 'when'

  function seededOrder(list, seed) {
    var arr = list.slice();
    var s = (seed || 1) % 2147483647;
    if (s < 1) s += 2147483646;
    function rnd() {
      s = (s * 48271) % 2147483647;
      return s / 2147483647;
    }
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function wordSeed(text) {
    var n = 1;
    String(text || '').split('').forEach(function (ch) { n = (n + ch.charCodeAt(0)) % 100000; });
    return n + 17;
  }

  function findWordIn(text, start, end, word) {

    var re = new RegExp('\\b' + String(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    var m = re.exec(slice);
    if (!m) return null;
    return { start: start + m.index, end: start + m.index + m[0].length, text: m[0] };
  }

  function matchSpans(text, coloc) {
    var parts = Array.isArray(coloc.match) ? coloc.match : [coloc.match];
    var spans = [];
    var from = 0;
    for (var i = 0; i < parts.length; i++) {
      var hit = findLiteral(text, parts[i], from);
      if (!hit) return null;
      spans.push(hit);
      from = hit.end;
    }
    return spans;
  }

  function posBucket(entry) {
    var s = entry && entry.chinese_meaning || '';
    var m = s.match(/[形名動副代]/);
    return m ? m[0] : '';
  }

  function wordBlank(entry) {
    var sentence = entry.example_sentence || '';
    var ranges = findRanges(sentence, phraseList(entry));
    if (ranges.length) return { how: 'form', span: ranges[0], note: '' };
    var re = /[A-Za-z][A-Za-z'-]*/g;
    var lemma = String(entry.word || '').toLowerCase();
    var best = null;
    var bestScore = 0;
    var m;
    while ((m = re.exec(sentence))) {
      var w = m[0].toLowerCase();
      var score = 0;
      var n = Math.min(w.length, lemma.length);
      for (var i = 0; i < n; i++) {
        if (w.charAt(i) !== lemma.charAt(i)) break;
        score++;
      }
      if (score > bestScore) {
        bestScore = score;
        best = { start: m.index, end: m.index + m[0].length, text: m[0] };
      }
    }
    if (best && bestScore >= 3) {
      return { how: 'closest', span: best, note: '例句沒有這個字的變化形，改挖最接近的「' + best.text + '」' };
    }
    return { how: 'skip', span: null, note: '例句裡找不到這個字，挖空略過' };
  }

  function choiceOptions(correct, banned, seed) {
    var ban = {};
    ban[String(correct || '').toLowerCase()] = true;
    (banned || []).forEach(function (b) { ban[String(b || '').toLowerCase()] = true; });
    var pool = PREP_POOL.filter(function (p) { return !ban[p.toLowerCase()]; });
    var picked = seededOrder(pool, seed).slice(0, 3);
    if (picked.length < 3) {
      PREP_POOL.forEach(function (p) {
        if (picked.length >= 3 || ban[p.toLowerCase()] || picked.indexOf(p) !== -1) return;
        picked.push(p);
      });
    }
    return seededOrder(picked.concat([correct]), seed + 3);
  }

  function wordOptions(entry, correct) {

    var same = others.filter(function (w) { return posBucket(w) === bucket; });
    var pool = same.length >= 3 ? same : others;
    var picked = seededOrder(pool, wordSeed(entry.word)).slice(0, 3).map(function (w) { return w.word; });
    return seededOrder(picked.concat([correct]), wordSeed(correct) + 9);
  }

  function clozeSpec(entry) {
    var sentence = entry.example_sentence || '';
    var blank = wordBlank(entry);
    var spec = {
      word: entry.word,
      sentence: sentence,
      translation: entry.example_translation || '',
      meaning: entry.chinese_meaning || '',
      speak: entry.speak_sentence || sentence,
      speakTr: entry.speak_translation || entry.example_translation || '',
      hasColoc: false,
      learn: null,
      mature: null,
      wordBlank: blank
    };
    var list = entry.collocations || [];
    if (!list.length) return spec;
    var coloc = list[0];
    var spans = matchSpans(sentence, coloc);
    if (!spans) {
      spec.wordBlank = blank.how === 'form' ? blank : {
        how: 'skip',
        span: blank.span,
        note: (blank.note ? blank.note + '；' : '') + '搭配詞不在例句裡'

    }
    spec.hasColoc = true;
    var alts = PREP_ALTS[entry.word] || [];

      var prep = whole.text.trim().split(/\s+/).pop();
      var prepSpan = findWordIn(sentence, whole.start, whole.end, prep);
      if (!prepSpan) prepSpan = { start: whole.end - prep.length, end: whole.end, text: sentence.slice(whole.end - prep.length, whole.end) };
      var learnAccept = alts.length ? alts.slice() : [prepSpan.text];
      if (learnAccept.map(function (s) { return s.toLowerCase(); }).indexOf(prepSpan.text.toLowerCase()) === -1) learnAccept.unshift(prepSpan.text);
      var fulls = [whole.text];
      alts.forEach(function (alt) {
        var bits = whole.text.trim().split(/\s+/);
        if (alt.toLowerCase() === bits[bits.length - 1].toLowerCase()) return;
        bits[bits.length - 1] = alt;
        fulls.push(bits.join(' '));

      spec.learn = {
        spans: [prepSpan],
        accepts: learnAccept,
        options: choiceOptions(prepSpan.text, learnAccept, wordSeed(entry.word))
      };
      spec.mature = { spans: [whole], accepts: fulls };
      return spec;
    }
    var key = PHRASE_KEY[coloc.text] || '';
    var keySpan = null;
    if (key) {
      for (var i = 0; i < spans.length && !keySpan; i++) keySpan = findWordIn(sentence, spans[i].start, spans[i].end, key);
    }
    if (!keySpan) {
      var shortest = spans.slice().sort(function (a, b) { return (a.end - a.start) - (b.end - b.start); })[0];
      keySpan = shortest;
    }
    var joined = spans.map(function (s) { return s.text; }).join(' ');
    var matureAccept = [joined];
    if (coloc.text && matureAccept.indexOf(coloc.text) === -1) matureAccept.push(coloc.text);
    spec.learn = {
      spans: [keySpan],
      accepts: [keySpan.text],
      options: choiceOptions(keySpan.text, [keySpan.text], wordSeed(entry.word))

    spec.mature = { spans: spans, accepts: matureAccept };

  var FILTER_KEY = 'vocabFilter';
  var activeFilters = [];

  function tagKind(tag) {
    var k = String(tag).split(':')[0];
    if (k === 'prefix' || k === 'suffix' || k === 'root') return 'affix';
    if (k === 'letter' || k === 'page' || k === 'comparison' || k === 'colloc' || k === 'note') return k;
    return null;
  }

  function tagSub(tag) {
    if (tagKind(tag) !== 'colloc') return '';
    var rest = tag.slice('colloc:'.length);

  function shownTags(tags) {

  }

  function prepOf(coloc) {
    if (!coloc || coloc.kind !== 'prep') return '';

    var bits = String(src || '').trim().split(/\s+/);
    return (bits[bits.length - 1] || '').replace(/[^a-z]/gi, '').toLowerCase();
  }

  function entryPreps(entry) {
    var out = [];
    (entry && entry.collocations || []).forEach(function (c) {

      if (p && out.indexOf(p) === -1) out.push(p);
    });
    return out;
  }

  function prepFilterTags() {
    var tags = [];
    allEntries().forEach(function (w) {
      entryPreps(w).forEach(function (p) {

      });
    });
    tags.sort();

  }

  function tagShort(tag) {
    var i = tag.indexOf(':');
    var k = tag.slice(0, i);
    var v = tag.slice(i + 1);
    if (k === 'letter') return v;
    if (k === 'page') return '第' + v + '頁';
    if (k === 'comparison') return v;
    if (k === 'root') return 'root: ' + v.split('（')[0].trim();
    if (k === 'suffix' || k === 'prefix') return v.split('（')[0].split('(')[0].trim();
    if (k === 'colloc') {
      if (v.charAt(0) === '+') return v;
      var j = v.indexOf(':');
      return j === -1 ? v : v.slice(j + 1);
    }
    return v;
  }

  function tagIcon(kind) {

  }

  function tagChip(tag, extra) {

  function filtersFromHash() {
    var body = location.hash.replace(/^#/, '');

    if (body.indexOf('list/') === 0) rest = body.slice(5);

    if (!rest) return null;

  }

  function loadFilters() {
    var fromHash = filtersFromHash();
    if (fromHash) return fromHash;
    try {
      var raw = JSON.parse(localStorage.getItem(FILTER_KEY) || '[]');
      return Array.isArray(raw) ? raw.filter(Boolean) : [];
    } catch (e) { return []; }
  }

  function writeHash(tab) {

  function wordMatches(entry) {
    if (!activeFilters.length) return true;
    var tags = (entry && entry.tags) || [];
    var groups = { page: [], letter: [], affix: [], comparison: [], colloc: [] };
    activeFilters.forEach(function (t) {
      var kind = tagKind(t);
      if (kind && groups[kind]) groups[kind].push(t);
    });
    var preps = entryPreps(entry);
    var names = Object.keys(groups);
    for (var i = 0; i < names.length; i++) {
      var sel = groups[names[i]];
      if (!sel.length) continue;
      var ok = false;
      for (var j = 0; j < sel.length; j++) {

        } else if (tags.indexOf(sel[j]) !== -1) { ok = true; break; }
      }
      if (!ok) return false;
    }
    return true;
  }

  function chunkIdForPage(num) {

  }

  function prepareFiltered() {

      else other = true;
    });
    if (!activeFilters.length || other) return window.VOCAB_ENSURE_ALL();
    var jobs = [];
    pages.forEach(function (num) {

      if (id) jobs.push(loadSection(id));

  window.VOCAB_PREPARE_PLAY = function () {

  function knownTags() {

    Object.keys(window.VOCAB_CHUNKS).forEach(function (id) {

  function refreshCrossLinks() {
    listEl.querySelectorAll('.card').forEach(function (card) {
      var entry = findEntry(card.dataset.word);
      if (!entry) return;
      var sent = card.querySelector('.sent');
      if (sent) {
        sent.textContent = '';
        markSentence(sent, entry.example_sentence, entry, { nav: true });
      }
      var indexed = indexOccurrences(entry);
      var runtime = null;
      if (!indexed) {
        runtime = [];
        allEntries().forEach(function (other) {
          if (other.word === entry.word || !other.example_sentence) return;
          if (findRanges(other.example_sentence, phraseList(entry)).length) runtime.push(other);
        });
      }
      var count = indexed ? indexed.length : runtime.length;
      var also = card.querySelector(':scope > .also');
      if (!count) {
        if (also) also.remove();
        return;
      }
      if (!also) {
        also = document.createElement('details');
        also.className = 'also';
        var summary = document.createElement('summary');
        summary.textContent = '也出現在這些例句';
        also.appendChild(summary);
        card.appendChild(also);
      }
      if (!also.dataset.bound) {
        also.dataset.bound = '1';
        also.addEventListener('toggle', function () {
          if (!also.open) return;

          var occ = indexOccurrences(current);
          if (!occ) return;
          Promise.all(occ.map(function (item) { return loadSection(item.chunk); })).then(function () {
            fillAlsoSources(also, current, occ.map(function (item) { return findEntryById(item.sentenceOf); }).filter(Boolean));
          });

    return words.concat(cloze);
  }

  function stats(now) {
    var end = endOfDay(now);
    var due = 0, fresh = 0, learning = 0, mature = 0;
    WORDS.forEach(function (w) {
      var card = view(w.word);
      if (isNew(card)) fresh += 1;
      if (card.due != null && card.interval > 0 && card.interval < 1) learning += 1;
      if (card.interval >= MATURE_DAYS) mature += 1;
      if (card.due != null && card.due <= end) due += 1;
    });
    return { due: due, fresh: fresh, learning: learning, mature: mature };
  }

  function nextDue(now) {
    var soonest = null;
    WORDS.forEach(function (w) {
      var card = view(w.word);
      if (card.due != null && card.due > now && (soonest == null || card.due < soonest)) soonest = card.due;
    });
    return soonest;
  }

  function paintGrades() {
    if (!active) return;
    var days = nextDays(view(active.word));
    var task = active.task;
    el.grades.querySelectorAll('button').forEach(function (b) {
      b.querySelector('small').textContent = formatInterval(days[b.dataset.grade]);
      var suggest = false;
      if (task && isClozeKey(active.word) && task.shape !== 'sentence') {
        if (autoGradeOn() && task.autoRating) suggest = b.dataset.grade === task.autoRating;
        else suggest = b.dataset.grade === 'again' && task.correct === false;
      }
      b.classList.toggle('suggest', suggest);
    });
  }

  var gradeToken = 0;
  var autoTimer = null;

  function hideAutoBar() {
    var bar = document.getElementById('srs-autograde');
    if (!bar) return;
    bar.hidden = true;
    bar.classList.remove('run');
  }

  function cancelAutoGrade() {
    gradeToken++;
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    hideAutoBar();
  }

  function answerChars(task) {
    if (task.spans && task.spans.length && task.spec) {
      return task.spans.map(function (sp) { return task.spec.sentence.slice(sp.start, sp.end); }).join(' ').length;
    }
    return String((task.accepts && task.accepts[0]) || '').length;
  }

  function clozeAutoRating(task) {
    if (!task.matched || task.dirty) return 'again';
    var secs = ((task.firstAt || Date.now()) - (task.shownAt || task.firstAt || Date.now())) / 1000;
    var goodAt = 3;
    var hardAt = 8;
    if (task.shape === 'mature' || task.shape === 'word-type') {
      var extra = Math.max(0, answerChars(task) - 4) * 0.5;
      goodAt += extra;
      hardAt += extra;
    }
    if (secs < goodAt) return 'easy';
    if (secs <= hardAt) return 'good';
    return 'hard';
  }

  function armAutoGrade() {
    var task = active && active.task;
    if (!task || !task.autoRating || task.shape === 'sentence' || !autoGradeOn()) return;
    var token = ++gradeToken;
    var key = active.word;
    var rating = task.autoRating;
    var bar = document.getElementById('srs-autograde');
    if (bar) {
      bar.hidden = false;
      bar.classList.remove('run');
      void bar.offsetWidth;
      bar.classList.add('run');
    }
    autoTimer = setTimeout(function () {
      autoTimer = null;
      if (token !== gradeToken) return;
      if (!active || active.word !== key || !active.revealed) return;
      grade(rating);
    }, 1500);
  }

  function afterClozeReveal() {
    var task = active && active.task;
    if (!task) return;
    var lines = [
      { lang: 'en', text: task.spec.speak },
      { lang: 'zh', text: task.spec.speakTr }
    ];
    var speak = autoplayOn() && typeof window.VOCAB_PLAY_LINES === 'function';
    var arm = task.shape !== 'sentence' && autoGradeOn() && task.autoRating;
    if (!speak) {
      if (arm) armAutoGrade();
      return;
    }
    var token = ++gradeToken;
    var key = active.word;
    window.VOCAB_PLAY_LINES(lines, el.study, function () {
      if (!arm || token !== gradeToken) return;
      if (!active || active.word !== key || !active.revealed) return;
      armAutoGrade();
    });
  }

  function normAnswer(s) {
    return String(s || '').replace(/…/g, ' ').trim().replace(/\s+/g, ' ').replace(/[.,!?;:，。！？；：]+$/g, '').toLowerCase();
  }

  function answersMatch(input, accepts) {
    var n = normAnswer(input);
    if (!n) return false;
    return (accepts || []).some(function (a) { return normAnswer(a) === n; });
  }

  function fillClozeSentence(parent, sentence, spans, mode) {
    parent.textContent = '';
    var parts = (spans || []).slice().sort(function (a, b) { return a.start - b.start; });
    var last = 0;
    parts.forEach(function (sp) {
      if (sp.start < last) return;
      if (sp.start > last) parent.appendChild(document.createTextNode(sentence.slice(last, sp.start)));
      if (mode === 'blank') {
        var blank = document.createElement('span');
        blank.className = 'blank';
        blank.setAttribute('aria-label', '空白');
        blank.textContent = '\u00a0';
        blank.style.minWidth = Math.max(2.4, (sp.end - sp.start) * 0.55) + 'em';
        parent.appendChild(blank);
      } else {
        var mark = document.createElement('mark');
        mark.className = 'hw';
        mark.textContent = sentence.slice(sp.start, sp.end);
        parent.appendChild(mark);
      }
      last = sp.end;
    });
    if (last < sentence.length) parent.appendChild(document.createTextNode(sentence.slice(last)));
  }

  function clozeTask(entry, card) {
    var spec = window.VOCAB_CLOZE_SPEC(entry);
    var shape = clozeShape(card, spec);
    var task = { shape: shape, spec: spec, correct: null, spans: [], accepts: [], options: [] };
    if (shape === 'sentence') {
      task.kindLabel = '整句';
      task.hint = '';
      return task;
    }
    if (shape === 'learn') {
      task.kindLabel = '選擇題 · 搭配';
      task.spans = spec.learn.spans;
      task.accepts = spec.learn.accepts;
      task.options = spec.learn.options;
      task.hint = spec.translation;
      return task;
    }
    if (shape === 'mature') {
      task.kindLabel = '填空 · 搭配';
      task.spans = spec.mature.spans;
      task.accepts = spec.mature.accepts;
      task.hint = spec.translation;
      return task;
    }
    var surface = spec.wordBlank && spec.wordBlank.span ? spec.wordBlank.span.text : entry.word;
    task.spans = spec.wordBlank && spec.wordBlank.span ? [spec.wordBlank.span] : [];
    task.accepts = [surface];
    task.hint = spec.meaning + (spec.translation ? '　' + spec.translation : '');
    task.note = spec.wordBlank ? spec.wordBlank.note : '';
    if (shape === 'word-choice') {
      task.kindLabel = '選擇題';
      task.options = window.VOCAB_CLOZE_OPTIONS(entry, surface);
    } else {
      task.kindLabel = '填空';
    }
    return task;
  }

  function paintCloze(entry) {
    if (!active.task) active.task = clozeTask(entry, view(active.word));
    var task = active.task;
    var spec = task.spec;
    el.prompt.hidden = true;
    el.show.hidden = true;
    el.back.hidden = true;
    el.cloze.hidden = false;
    if (!active.revealed && !task.shownAt) task.shownAt = Date.now();
    if (!active.revealed) hideAutoBar();
    el.clozeKind.textContent = '例句挖空 · ' + task.kindLabel + (task.note ? '（' + task.note + '）' : '');
    el.clozeHint.textContent = '';
    el.clozeResult.hidden = true;
    el.clozeResult.textContent = '';
    el.clozeResult.className = 'result';
    el.clozeChoices.textContent = '';
    el.clozeForm.hidden = true;
    if (!active.revealed) {
      if (task.shape === 'sentence') {
        el.clozeSent.textContent = spec.translation || '';
        el.clozeHint.textContent = '看中文，輸入或說出整句英文，再對答案。';
      } else {
        fillClozeSentence(el.clozeSent, spec.sentence, task.spans, 'blank');
        el.clozeHint.textContent = task.hint || '';
      }
      if (task.options && task.options.length && task.shape !== 'mature' && task.shape !== 'word-type' && task.shape !== 'sentence') {
        el.clozeChoices.hidden = false;
        task.options.forEach(function (opt) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = opt;
          b.addEventListener('click', function () { onClozeChoice(opt, b); });
          el.clozeChoices.appendChild(b);
        });
      } else el.clozeChoices.hidden = true;
      if (!task.options || !task.options.length || task.shape === 'mature' || task.shape === 'word-type' || task.shape === 'sentence') {
        el.clozeForm.hidden = false;
        el.clozeInput.value = '';
        el.clozeGo.textContent = task.shape === 'sentence' ? '看答案' : '送出';
      }
      el.grades.hidden = true;
      return;
    }
    el.clozeChoices.hidden = true;
    el.clozeForm.hidden = true;
    if (task.shape === 'sentence') {
      el.clozeSent.textContent = spec.sentence;
      el.clozeHint.textContent = spec.translation || '';
      el.clozeResult.hidden = false;
      el.clozeResult.textContent = '請對照答案自己評分';
    } else {
      fillClozeSentence(el.clozeSent, spec.sentence, task.spans, 'mark');
      el.clozeHint.textContent = task.hint || '';
      el.clozeResult.hidden = false;
      var matched = task.matched != null ? task.matched : !!task.correct;
      el.clozeResult.classList.add(matched ? 'ok' : 'bad');
      if (!matched) el.clozeResult.textContent = '✗ 正確答案：' + task.spans.map(function (sp) { return spec.sentence.slice(sp.start, sp.end); }).join(' … ');
      else el.clozeResult.textContent = task.dirty ? '✓ 正確（改過答案）' : '✓ 正確';
    }
    el.grades.hidden = false;
    paintGrades();
  }

  function finishCloze(task) {
    task.autoRating = (task.shape === 'sentence' || !autoGradeOn()) ? null : clozeAutoRating(task);
    task.correct = !!(task.matched && !task.dirty);
    active.revealed = true;
    paintCard();
    afterClozeReveal();
  }

  function onClozeChoice(opt, btn) {
    if (!active || !isClozeKey(active.word) || active.revealed) return;
    var task = active.task;
    if (!task) return;
    if (!autoGradeOn()) { submitCloze(opt); return; }
    if (!task.firstAt) task.firstAt = Date.now();
    var ok = answersMatch(opt, task.accepts);
    if (!ok) {
      task.dirty = true;
      if (btn) { btn.classList.add('miss'); btn.disabled = true; }
      return;
    }
    task.matched = true;
    finishCloze(task);
  }

  function submitCloze(value) {
    if (!active || !isClozeKey(active.word) || active.revealed) return;
    var task = active.task;
    if (!task) return;
    if (task.shape === 'sentence') {
      task.matched = null;
      task.dirty = false;
      task.correct = null;
      task.autoRating = null;
      active.revealed = true;
      paintCard();
      afterClozeReveal();
      return;
    }
    if (!autoGradeOn()) {
      task.matched = answersMatch(value, task.accepts);
      task.dirty = false;
      task.correct = task.matched;
      task.autoRating = null;
      active.revealed = true;
      paintCard();
      afterClozeReveal();
      return;
    }
    if (!task.firstAt) task.firstAt = Date.now();
    var ok = answersMatch(value, task.accepts);
    if (!ok && !task.dirty) {
      task.dirty = true;
      el.clozeResult.hidden = false;
      el.clozeResult.className = 'result bad';
      el.clozeResult.textContent = '✗ 不對。改完再送出，這題會記為 Again。';
      return;
    }
    task.matched = ok;
    finishCloze(task);
  }

  function paintCard() {
    var entry = byWord[baseWord(active.word)];
    if (!entry) return;
    var now = Date.now();
    var q = queueWords(now);
    var left = q.length + (q.indexOf(active.word) === -1 ? 1 : 0);
    var dirLabel = active.dir === 'zh' ? '中文 → English' : 'English → 中文';
    if (cramOn) {
      el.meta.textContent = '加碼模式・不影響排程 · ' + dirLabel;
      el.remain.textContent = '這輪 ' + (cramQueue.length + 1) + ' 張';
    } else if (isClozeKey(active.word)) {
      el.meta.textContent = '#' + entry.num + ' · 第' + entry.page + '頁 · 例句挖空';
      el.remain.textContent = '這輪 ' + left + ' 張';
    } else {
      el.meta.textContent = '#' + entry.num + ' · 第' + entry.page + '頁 · ' + dirLabel;
      el.remain.textContent = '這輪 ' + left + ' 張';
    }
    if (isClozeKey(active.word)) {
      paintCloze(entry);
      el.study.hidden = false;
      el.done.hidden = true;
      return;
    }
    if (el.cloze) el.cloze.hidden = true;
    el.prompt.hidden = false;
    fillPrompt(entry, active.dir);
    fillBack(entry, active.dir);
    el.show.hidden = active.revealed;
    el.back.hidden = !active.revealed;
    el.grades.hidden = !active.revealed;
    paintGrades();
    el.study.hidden = false;
    el.done.hidden = true;
  }

  function paintDone() {
    var now = Date.now();
    var soonest = nextDue(now);
    var today = dayKey(now);
    var unseen = 0;
    WORDS.forEach(function (w) {
      if (isNew(view(w.word)) && !view(w.word).introduced) unseen += 1;
    });
    var lines = [];
    if (soonest) lines.push('下一張到期：' + formatWhen(soonest, now) + '。');
    if (unseen > 0 && introducedTodayCount(today) >= newLimit(today)) {
      lines.push('新卡已達今日上限（' + newLimit(today) + '）。其餘 ' + unseen + ' 張新卡明天再練習。');
    } else if (!soonest && unseen === 0) {
      lines.push('目前沒有更晚的到期時間。');
    }
    if (!lines.length) lines.push('調整每日新卡數量，或稍後再來。');
    var text = lines.join(' ');
    if (el.doneText.textContent !== text) el.doneText.textContent = text;
    var bonus5 = document.getElementById('bonus-5');
    var bonus10 = document.getElementById('bonus-10');
    var cramRound = document.getElementById('cram-round');
    var cramAll = document.getElementById('cram-all');
    if (bonus5) bonus5.hidden = unseen === 0;
    if (bonus10) bonus10.hidden = unseen === 0;
    var learned = cramCandidates(now).length;
    if (cramRound) cramRound.hidden = learned === 0;
    if (cramAll) cramAll.hidden = learned === 0;
    el.study.hidden = true;
    el.done.hidden = false;
    if (el.cloze) el.cloze.hidden = true;
  }

  function chooseDir() {
    if (state.direction === 'mixed') return Math.random() < 0.5 ? 'en' : 'zh';
    return state.direction;
  }

  function ensureDeck() {
    if (deckReady) return Promise.resolve();
    if (deckPromise) return deckPromise;
    el.study.hidden = false;
    el.done.hidden = true;
    el.back.hidden = true;
    el.grades.hidden = true;
    el.show.hidden = true;
    if (el.cloze) el.cloze.hidden = true;
    el.prompt.hidden = false;
    el.prompt.classList.remove('lang-zh');
    el.prompt.textContent = '載入中…';
    el.meta.textContent = '';
    el.remain.textContent = '';
    el.msg.textContent = '';
    var loadAll = window.VOCAB_ENSURE_ALL;
    deckPromise = Promise.resolve()
      .then(function () {
        if (typeof loadAll !== 'function') throw new Error('loader');
        return loadAll();
      })
      .then(function (words) {
        setWords(words);
        deckReady = true;
        el.msg.textContent = '';
      })
      .catch(function (err) {
        deckPromise = null;
        deckReady = false;
        el.study.hidden = true;
        el.msg.textContent = '無法載入單字。';
        throw err;
      });
    return deckPromise;
  }

  function showNext() {
    if (!deckReady) return;
    paintStats();
    paintDirection();
    if (cramOn) {
      if (!cramQueue.length) {
        cramOn = false;
        active = null;
        paintDone();
        return;
      }
      var nextWord = cramQueue.shift();
      active = { word: nextWord, dir: chooseDir(), revealed: false };
      paintCard();
      paintStats();
      return;
    }
    if (!WORDS.length) {
      active = null;
      paintDone();
      return;
    }
    var now = Date.now();
    var q = queueWords(now);
    if (!q.length) {
      active = null;
      paintDone();
      return;
    }
    var word = q[0];
    var card = ensure(word);
    if (isNew(card) && !card.introduced) {
      card.introduced = dayKey(now);
      save();
    }
    active = { word: word, dir: chooseDir(), revealed: false };
    paintCard();
    paintStats();
  }

  function autoplayOn() {
    try {
      var v = localStorage.getItem('vocabSrsAutoplay');
      if (v == null || v === '') return true;
      return v === '1';
    } catch (e) { return true; }
  }

  function playShownCard() {
    if (!active) return;
    var entry = byWord[active.word];
    if (!entry || typeof window.VOCAB_PLAY_CARD !== 'function') return;
    window.VOCAB_PLAY_CARD({
      word: entry.word,
      zh: entry.speak_meaning || entry.chinese_meaning,
      ex: entry.speak_sentence || entry.example_sentence,
      tr: entry.speak_translation || entry.example_translation,
      el: el.study
    });
  }

  function reveal() {
    if (!active || active.revealed) return;
    active.revealed = true;
    paintCard();
    if (autoplayOn()) playShownCard();
  }

  function grade(rating) {
    if (!srsOn() || !active || !active.revealed) return;
    cancelAutoGrade();
    if (typeof window.VOCAB_STOP === 'function') window.VOCAB_STOP();
    else if (S) { try { S.cancel(); } catch (e) {} }
    var word = active.word;
    if (cramOn) {
      if (rating === 'again') cramQueue.push(word);
      el.msg.textContent = '';
      active = null;
      showNext();
      return;
    }
    state.cards[word] = schedule(ensure(word), rating, Date.now());
    save();
    el.msg.textContent = '';
    active = null;
    showNext();
  }

  function applyTab(tab, opts) {
    opts = opts || {};
    if (tab !== 'srs') tab = 'list';
    var was = document.documentElement.getAttribute('data-view');
    document.documentElement.setAttribute('data-view', tab);
    try { localStorage.setItem(TAB_KEY, tab); } catch (e) {}
    var onSrs = tab === 'srs';
    el.tabList.setAttribute('aria-selected', onSrs ? 'false' : 'true');
    el.tabSrs.setAttribute('aria-selected', onSrs ? 'true' : 'false');
    el.list.setAttribute('aria-hidden', onSrs ? 'true' : 'false');
    el.srs.setAttribute('aria-hidden', onSrs ? 'false' : 'true');
    if (!opts.skipHash) {
      var want = '#' + tab;
      if (window.VOCAB_WRITE_HASH) window.VOCAB_WRITE_HASH(tab);
      else if (location.hash !== want) history.replaceState(null, '', want);
    }
    if (onSrs && was !== 'srs') {
      var stopBtn = document.getElementById('stop');
      if (stopBtn) stopBtn.click();
    }
    if (onSrs) {
      ensureDeck().then(function () {
        if (!srsOn()) return;
        if (!active) showNext();
        else {
          paintStats();
          paintDirection();
          paintCard();
        }
      }).catch(function () {});
    }
  }

  el.show.addEventListener('click', reveal);
  el.grades.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.grade) return;
    grade(b.dataset.grade);
  });
  document.querySelector('#srs-view .seg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.dataset.dir) return;
    state.direction = b.dataset.dir;
    save();
    paintDirection();
    if (active && !active.revealed) {
      active.dir = chooseDir();
      paintCard();
    }
  });
  function beginBonus(n) {
    addBonus(n);
    cramOn = false;
    cramQueue = [];
    active = null;
    if (typeof window.VOCAB_STOP === 'function') window.VOCAB_STOP();
    showNext();
  }

  function beginCram(all) {
    var list = cramCandidates(Date.now());
    if (!list.length) return;
    if (all) cramQueue = list.slice();
    else {
      var words = list.filter(function (k) { return !isClozeKey(k); });
      var cloze = list.filter(isClozeKey);
      cramQueue = words.slice(0, 15);
      if (cramQueue.length < 15) cramQueue = cramQueue.concat(cloze.slice(0, 15 - cramQueue.length));
    }
    cramOn = true;
    active = null;
    if (typeof window.VOCAB_STOP === 'function') window.VOCAB_STOP();
    showNext();
  }

  document.getElementById('bonus-5').addEventListener('click', function () { beginBonus(5); });
  document.getElementById('bonus-10').addEventListener('click', function () { beginBonus(10); });
  document.getElementById('cram-round').addEventListener('click', function () { beginCram(false); });
  document.getElementById('cram-all').addEventListener('click', function () { beginCram(true); });
  document.getElementById('srs-autoplay').addEventListener('change', function () {
    try { localStorage.setItem('vocabSrsAutoplay', this.checked ? '1' : '0'); } catch (e) {}
    if (!this.checked && typeof window.VOCAB_STOP === 'function') window.VOCAB_STOP();
  });
  document.getElementById('srs-autograde-on').addEventListener('change', function () {
    try { localStorage.setItem('vocabSrsAutoGrade', this.checked ? '1' : '0'); } catch (e) {}
    if (!this.checked) cancelAutoGrade();
  });
  document.getElementById('srs-cloze-on').addEventListener('change', function () {
    try { localStorage.setItem('vocabSrsCloze', this.checked ? '1' : '0'); } catch (e) {}
    if (!this.checked && active && isClozeKey(active.word)) {
      active = null;
      if (typeof window.VOCAB_STOP === 'function') window.VOCAB_STOP();
      if (srsOn()) showNext();
    }
  });
  document.getElementById('srs-cloze-mode').addEventListener('change', function () {
    try { localStorage.setItem('vocabSrsClozeMode', this.value); } catch (e) {}
    if (active && isClozeKey(active.word) && !active.revealed) {
      active.task = null;
      paintCard();
    }
  });
  el.clozeForm.addEventListener('submit', function (e) {
    e.preventDefault();
    submitCloze(el.clozeInput.value);
  });

  el.perDay.addEventListener('change', function () {
    var n = Number(el.perDay.value);
    if (!isFinite(n)) {
      el.perDay.value = String(state.newPerDay);
      return;
    }
    state.newPerDay = Math.max(0, Math.min(999, Math.round(n)));
    el.perDay.value = String(state.newPerDay);
    save();
    if (!srsOn()) return;
    if (active) paintCard();
    else showNext();
  });

  document.getElementById('srs-export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2) + '\n'], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'vocabSRS_v1.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    el.msg.textContent = '';
  });
  document.getElementById('srs-import').addEventListener('click', function () {
    document.getElementById('srs-file').click();
  });
  document.getElementById('srs-file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var raw = JSON.parse(String(reader.result));
        if (!raw || typeof raw !== 'object' || Array.isArray(raw) || !raw.cards || typeof raw.cards !== 'object') {
          throw new Error('bad shape');
        }
        var next = defaultState();
        var n = Number(raw.newPerDay);
        if (isFinite(n)) next.newPerDay = Math.max(0, Math.min(999, Math.round(n)));
        if (raw.direction === 'zh' || raw.direction === 'mixed' || raw.direction === 'en') next.direction = raw.direction;
        Object.keys(raw.cards).forEach(function (word) {
          next.cards[word] = clampCard(raw.cards[word]);
        });
        state = next;
        save();
        active = null;
        el.msg.textContent = '已匯入進度。';
        if (srsOn()) showNext();
        else paintStats();
      } catch (err) {
        el.msg.textContent = '無法匯入這個檔案。請選擇先前匯出的 JSON。';
      }
    };
    reader.readAsText(file);
  });
  document.getElementById('srs-reset').addEventListener('click', function () {
    if (!confirm('Reset progress?\n這會清除本機的 SRS 進度，無法復原。')) return;
    state = defaultState();
    save();
    active = null;
    el.msg.textContent = '進度已重設。';
    if (srsOn()) showNext();
    else paintStats();
  });

  el.srs.addEventListener('click', function (e) {
    var b = e.target.closest('.say');
    if (!b || !active) return;
    if (b.classList.contains('sc') || b.dataset.say === 'card') {
      var entry = byWord[active.word];
      if (!entry || typeof window.VOCAB_PLAY_CARD !== 'function') return;
      window.VOCAB_PLAY_CARD({
        word: entry.word,
        zh: entry.speak_meaning || entry.chinese_meaning,
        ex: entry.speak_sentence || entry.example_sentence,
        tr: entry.speak_translation || entry.example_translation,
        el: el.study
      });
      return;
    }
    speakPart(byWord[active.word], b.dataset.say);
  });

  el.backTags.addEventListener('click', function (e) {
    var colocBtn = e.target.closest && e.target.closest('.coloc-chip');
    if (colocBtn && active && window.VOCAB_PAINT_COLOC) {
      e.preventDefault();
      var entry = byWord[baseWord(active.word)];
      if (!entry) return;
      var idx = Number(colocBtn.getAttribute('data-coloc'));
      window.VOCAB_PAINT_COLOC(el.back, entry, colocBtn.getAttribute('aria-pressed') === 'true' ? null : idx, false);
      return;
    }
    var chip = e.target.closest && e.target.closest('.tag');
    if (!chip) return;
    var tag = chip.getAttribute('data-tag');
    if (!tag || typeof window.VOCAB_TOGGLE_FILTER !== 'function') return;
    window.VOCAB_TOGGLE_FILTER(tag);
    applyTab('list');
  });

  el.tabList.addEventListener('click', function () { applyTab('list'); });
  el.tabSrs.addEventListener('click', function () { applyTab('srs'); });
  window.addEventListener('hashchange', function () {
    var hashBody = location.hash.replace(/^#/, '');
    if (hashBody === 'srs' || hashBody.indexOf('srs/') === 0) applyTab('srs', { skipHash: true });
    else if (hashBody === 'list' || hashBody.indexOf('list/') === 0) {
      applyTab('list', { skipHash: true });
      if (window.VOCAB_READ_HASH) window.VOCAB_READ_HASH();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!srsOn()) return;
    if (e.target && e.target.closest && e.target.closest('input, textarea, select')) return;
    if (e.key === ' ' || e.code === 'Space') {
      if (e.target && e.target.closest && e.target.closest('button, a, .tabs, .rate')) return;
      e.preventDefault();
      if (active && !active.revealed && !isClozeKey(active.word)) reveal();
      return;
    }
    if (e.repeat || !active || !active.revealed) return;
    var map = { '1': 'again', '2': 'hard', '3': 'good', '4': 'easy' };
    if (map[e.key]) {
      e.preventDefault();
      grade(map[e.key]);
    }
  });

  setInterval(function () {
    if (!srsOn() || !deckReady) return;
    if (!active) showNext();
    else paintStats();
  }, 1000);

  applyTab(document.documentElement.getAttribute('data-view') || 'list', { skipHash: true });
})();
</script>
<script>
(function(){
  var btn=document.getElementById('to-top');
  function sync(){var show=window.scrollY>300;btn.hidden=!show}
  window.addEventListener('scroll',sync,{passive:true});
  window.addEventListener('resize',sync);
  btn.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
  sync();
})();
</script>
</body>
