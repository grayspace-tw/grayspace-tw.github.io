<head>

<title>基本英文 100 句練習</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2530;--sub:#5d6877;--line:#dde2e8;--accent:#2563eb;--accent-soft:#e6eefc;--ok:#15803d;--ok-soft:#e3f5e8;--bad:#b91c1c;--bad-soft:#fde8e8;--warn-soft:#fff3d6;--ev:#2563eb;--ev-bg:#e6eefc;--hyp:#7c3aed;--hyp-bg:#f0e9fe;--ref:#b45309;--ref-bg:#fff3d6;--okc:#15803d;--ok-bg:#e3f5e8;--gr:#5d6877;--gr-bg:#eef0f3}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 80px}
h1{font-size:20px;margin:8px 0 2px}
.sub{color:var(--sub);font-size:13px;margin:0 0 10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.prog{font-size:13px;color:var(--sub);margin:4px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button,select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.tabs button{flex:1 1 auto;min-width:70px}
.partdesc{font-size:13px;color:var(--sub);margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card.done{border-color:var(--ok);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft)),var(--card)}
.no{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.zh{font-size:17px;font-weight:600;margin:2px 0 6px}
.en{font-size:17px;color:var(--accent);margin:2px 0 6px;font-family:Georgia,"Times New Roman",serif}
.en.hid{background:var(--line);color:transparent;border-radius:6px;cursor:pointer;user-select:none;min-height:1.6em}
.pt{font-size:13px;color:var(--sub);border-left:3px solid var(--line);padding-left:8px;margin:6px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts button{padding:5px 10px;font-size:13px}
textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--text);resize:vertical;min-height:64px;font-family:Georgia,serif}
.diff{font-size:17px;font-family:Georgia,serif;margin:8px 0}
.diff span{padding:0 2px;border-radius:4px;margin-right:2px}
.diff .m{background:var(--ok-soft);color:var(--ok)}
.diff .x{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.diff .e{background:var(--warn-soft)}
.msg{font-size:14px;margin:6px 0}
.lab{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.warn{background:var(--warn-soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.tl{margin:8px 0;border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px;background:var(--bg)}
.tl.hid{display:none}
.tl-head{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:13px;font-weight:600;color:var(--sub)}
.tl-head span:nth-child(2){color:var(--accent)}
.tl-axis{height:0;border-top:2px solid var(--line);margin:4px 0 0;position:relative}
.tl-axis::after{content:"▶";position:absolute;right:-4px;top:-10px;font-size:11px;color:var(--sub)}
.tl-body{position:relative;padding:6px 0;background:linear-gradient(to right,transparent 33.333%,var(--accent-soft) 33.333%,var(--accent-soft) 66.666%,transparent 66.666%),linear-gradient(to right,transparent calc(33.333% - .5px),var(--line) calc(33.333% - .5px),var(--line) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),var(--line) calc(66.666% - .5px),var(--line) calc(66.666% + .5px),transparent calc(66.666% + .5px))}
.tl-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:5px 0}
.tl-chip{margin:0 4px;padding:4px 8px;border:1.5px solid;border-radius:8px;font-size:12.5px;line-height:1.35;color:var(--text);overflow-wrap:anywhere}
.tl-chip b{font-weight:600;display:block}
.tl-chip small{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.tl-chip .ar{color:var(--sub);font-weight:700;margin-right:3px}
.tl-chip.sp{border-radius:18px;padding:4px 12px}
.tl-chip.sp.arrow{position:relative;padding-right:24px}
.tl-chip.sp.arrow::after{content:"▶";position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px}
.tl-chip.stretch{border-radius:3px;border-left-width:7px;border-right-width:7px;text-align:center;padding:5px 6px}
.tl-chip.ptr{text-align:center;margin-top:16px;position:relative}
.tl-chip.ptr::before{content:"↑";position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:18px;font-weight:700;line-height:1;color:var(--ev)}
.k-ev{border-color:var(--ev);background:var(--ev-bg)}
.k-hyp{border-color:var(--hyp);background:var(--hyp-bg);border-style:dashed}
.k-ref{border-color:var(--ref);background:var(--ref-bg)}
.k-ok{border-color:var(--okc);background:var(--ok-bg)}
.k-gray{border-color:var(--gr);background:var(--gr-bg)}
.tl3{--lw:36px}
.tl3 .tl-head,.tl3 .tl-axis{margin-left:var(--lw)}
.tl3 .tl-body{display:grid;grid-template-columns:var(--lw) repeat(3,minmax(0,1fr));row-gap:6px;padding:0;grid-auto-rows:minmax(34px,auto);
 background:linear-gradient(to right,transparent var(--lw),var(--accent-soft) var(--lw)) no-repeat}
.tl3 .tl-body{background:
 linear-gradient(to right,transparent calc(var(--lw) + (100% - var(--lw))/3),var(--accent-soft) calc(var(--lw) + (100% - var(--lw))/3),var(--accent-soft) calc(var(--lw) + (100% - var(--lw))*2/3),transparent calc(var(--lw) + (100% - var(--lw))*2/3))}
.l3band{grid-column:1 / 5;border-top:1px dashed var(--line);z-index:0;margin:-3px 0}
.l3band.nul{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);opacity:.3;margin:-1px 0}
.l3lab{grid-column:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub);z-index:1}
.l3lab.nul{font-weight:500;font-size:11px}
.tl3 .tl-chip{z-index:2;align-self:center;position:relative;margin-top:4px;margin-bottom:4px;margin-left:3px;margin-right:3px;padding-left:6px;padding-right:6px}
.tl3 .tl-chip.sp{padding-left:12px}
.tl3 .tl-chip.pu{margin-top:18px}
.tl3 .tl-chip.pd{margin-bottom:18px}
.tl3 .tl-chip.pu::before,.tl3 .tl-chip.pd::after{position:absolute;left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;line-height:1;color:var(--ev)}
.tl3 .tl-chip.pu::before{content:"↑";top:-19px}
.tl3 .tl-chip.pd::after{content:"↓";bottom:-19px}
.tl3 .tl-chip.pu,.tl3 .tl-chip.pd{text-align:center}
.tl3 .tl-chip.dot{position:relative;padding-left:22px}
.tl3 .tl-chip.dot::before{content:"";position:absolute;left:8px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--okc)}
.tl3 .tl-chip.k-ev.dot::before{background:var(--ev)}
.tl3 .tl-chip.k-gray.dot::before{background:var(--gr)}
.tl3 .tl-chip.L{justify-self:start;width:76%}
.tl3 .tl-chip.R{justify-self:end;width:76%}
.tl3 .tl-chip.L,.tl3 .tl-chip.R{padding-left:5px;padding-right:5px;font-size:12px}
.tl3 .tl-chip.L b,.tl3 .tl-chip.R b{font-size:11.5px;letter-spacing:-.2px}
.tl3 .tl-chip .pdot{color:var(--ev);margin-right:3px}
.tl3 .tl-link{align-self:center;z-index:1;margin:0 41%;text-align:center;font-size:10px;color:var(--ev);font-weight:600;line-height:1.2;white-space:nowrap}
.tl3 .tl-link i{display:block;height:2px;background:var(--ev);margin:3px 8px 0 0;position:relative}
.tl3 .tl-link i::after{content:"";position:absolute;right:-8px;top:-4px;border-left:9px solid var(--ev);border-top:5px solid transparent;border-bottom:5px solid transparent}
.l3none{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.3;color:var(--sub);z-index:1;pointer-events:none;padding:0 6px}
.tl3 .tl-chip.xs{align-self:stretch;display:flex;flex-direction:column;justify-content:center;margin:6px 3px 6px 12px;border-radius:14px}
.tl-cap{font-size:13px;color:var(--sub);margin:6px 2px 0}
.tl-key{font-size:11px;color:var(--sub);margin:4px 2px 0}
.small{font-size:12px;color:var(--sub);margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
<h1>基本英文 100 句練習</h1>
<p class="sub">仿「時態・邏輯・句子組裝」的選句原則，自編 100 句原創例句（非任何書籍原文）。進度存在這個瀏覽器中。</p>
<div class="warn" id="warn" style="display:none">⚠️ 這個瀏覽器無法使用 localStorage（可能是無痕模式或被停用），進度無法自動儲存，關閉頁面後會消失。請用下方「匯出進度」自行備份。</div>
<div class="bar"><i id="bar"></i></div>
<div class="prog" id="prog"></div>

<div class="row tabs" id="tabs"></div>
<div class="partdesc" id="partdesc"></div>

<div class="row" id="modes">
  <button data-m="list">清單</button>
  <button data-m="practice">練習（中翻英）</button>
</div>
<div class="row" id="filters">
  <button data-f="all">全部</button>
  <button data-f="todo">未記住</button>
  <button data-f="done">已記住</button>
</div>
<div class="row">
  <label class="lab"><input type="checkbox" id="hideEn"> 清單中隱藏英文</label>
  <label class="lab"><input type="checkbox" id="showTl"> 顯示時間軸（第 1 部分）</label>
  <label class="lab"><input type="checkbox" id="autoSpeak"> 翻開答案時自動朗讀</label>
  <label class="lab">語速 <select id="rate"><option value="0.7">慢</option><option value="0.9" selected>正常</option><option value="1.1">快</option></select></label>
</div>
<div id="view"></div>
<div class="card">
  <div class="zh" style="font-size:15px">進度備份</div>
  <div class="pt">「已記住」的進度只存在這個瀏覽器（localStorage），換瀏覽器、換裝置或清除網站資料後就不會跟著走。想換裝置或做備份，請先「匯出進度」存成 JSON 檔，之後再「匯入進度」還原。</div>
  <div class="acts"><button id="exportBtn">匯出進度</button><button id="importBtn">匯入進度</button><button id="resetBtn">清除全部進度</button></div>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  <div class="msg" id="ioMsg"></div>
</div>
<p class="small" id="ttsNote"></p>
</div>

var DATA=[{"id": "part1", "title": "第一部分：時態", "range": "001–040", "desc": "先分清楚「現實」與「假設」，再練各種時態。", "items": [["如果我有更多時間，我就會去學游泳。", "If I had more time, I would learn to swim.", "與現在事實相反的假設：if + 過去式，主句用 would + 原形。", {"v3": true, "legend": "key", "cap": "if 子句把時間退一步（過去式）；從那個過去看「未來」用 would，落點其實就是現在。兩者都是「簡單」層的點。", "rows": [[0, 0, 0, 0, "if I had more time\n基準點：退到過去", "hyp", null, null], [0, 0, 1, 1, "I would learn to swim\n過去的未來＝現在", "hyp", 0, null]]}], ["如果我是你，我會先去跟老師談一談。", "If I were you, I would talk to the teacher first.", "假設語氣中，if 子句的 be 動詞一律用 were。", {"v3": true, "legend": "key", "cap": "were 也是退一步的過去式；從過去的基準點看未來用 would，落在現在，表示「現在不是你」的假設。", "rows": [[0, 0, 0, 0, "if I were you\n基準點：退到過去", "hyp", null, null], [0, 0, 1, 1, "I would talk to the teacher first\n過去的未來＝現在", "hyp", 0, null]]}], ["如果我們當時有地圖，就不會迷路了。", "If we had had a map, we would not have lost our way.", "與過去事實相反的假設：had + 過去分詞，主句用 would have + 過去分詞。", {"v3": true, "legend": "key", "cap": "與過去事實相反。事實（簡單層）：當時沒有地圖，真的迷路了。if 子句的時間再退一步成 had + 過去分詞（放在「完成」層，比當時更早的過去）；從那個更早的基準點看未來用 would（would not have lost），落點就是當時迷路的那個過去。", "rows": [[0, 0, 0, 0, "lost our way\n事實：迷路了", "gray", null, null], [2, 2, 0, 0, "if we had had a map\n更早的假設", "hyp", null, null], [2, 2, 0, 0, "would not have lost\n當時就不會迷路", "hyp", 0, null]]}], ["我真希望我住得離學校近一點。", "I wish I lived closer to my school.", "wish + 過去式：表達對「現在」事實的遺憾。", {"v3": true, "legend": "key", "cap": "wish 在現在說出願望；後面的動詞退一步成過去式，但指的是「現在」與事實相反。", "rows": [[0, 0, 1, 1, "I wish\n現在說出的願望", "ok", null, null], [0, 0, 0, 0, "I lived closer to my school\n動詞退一步（過去式）", "hyp", 1, null], [0, 0, 1, 1, "指的是現在\n事實：住得不近", "gray", 0, null]]}], ["我真希望昨天有帶傘。", "I wish I had brought an umbrella yesterday.", "wish + 過去完成式：表達對「過去」事實的遺憾。", {"v3": true, "legend": "key", "cap": "wish 之後的動詞再退一步成 had + 過去分詞（「完成」層），指的是「過去」（yesterday）的事與事實相反：昨天沒帶傘。", "rows": [[0, 0, 1, 1, "I wish\n現在說出的願望", "ok", null, null], [0, 0, 0, 0, "沒帶傘\n事實：昨天", "gray", null, null], [2, 2, 0, 0, "had brought an umbrella\n再退一步", "hyp", 1, null]]}], ["在這麼暗的路上騎腳踏車會很危險。", "It would be dangerous to ride a bike on such a dark road.", "would be ... to ...：用「會」委婉表達假設情況下的判斷。", {"v3": true, "legend": "key", "cap": "would 在這裡不是過去，而是「假設」：想像真的去做某件事，那時的判斷是危險的。", "rows": [[0, 0, 1, 2, "to ride a bike on such a dark road\n假設的行動（沒有真的發生）", "hyp", null, "-"], [0, 0, 1, 2, "It would be dangerous\n假設之下的判斷", "hyp", 1, null]]}], ["如果明天下雨，比賽就會取消。", "If it rains tomorrow, the game will be canceled.", "可能發生的真實條件：if + 現在式，主句用 will。", {"v3": true, "legend": "key", "cap": "真實的條件：if 子句雖然指未來，動詞仍用現在式；只有結果句才用 will。", "rows": [[0, 0, 2, 2, "it rains tomorrow\nif：現在式代表未來", "ev", null, null], [0, 0, 2, 2, "the game will be canceled\n結果句：will", "ev", 2, null]]}], ["她講得好像去過巴黎一樣，但其實她從來沒有離開過台灣。", "She talks as though she had been to Paris, but she has never left Taiwan.", "as though 與 as if 同義，後接過去完成式：「彷彿（以前）曾經……」，與事實不符。", {"v3": true, "legend": "perf", "cap": "as though 後面的動詞退一步：had been 表示「（現在說話之前）去過」這個與事實不符的想像；事實是從出生一路到現在都沒離開過（持續型）。", "rows": [[0, 0, 1, 1, "She talks\n現在說話的樣子", "ok", null, null], [2, 2, 0, 0, "had been to Paris\n想像：去過（不符事實）", "hyp", 1, null], [2, 2, 0, 1, "she has never left Taiwan\n事實：持續到現在沒離開", "gray", null, ">s"]]}], ["我小時候就會游泳，而昨天我成功游過了整座湖。", "I could swim when I was a child, and yesterday I was able to swim across the whole lake.", "could 表示過去「具備的能力」；was able to 表示過去「某一次成功做到」。", {"v3": true, "legend": "key", "cap": "could＝小時候那一段期間一直具備的能力（長條）；was able to＝昨天某一次真的做到（單點；swim across the whole lake）。兩者都在過去。", "rows": [[0, 0, 0, 0, "could swim\n小時候：一直會", "ok", null, "b"], [0, 0, 0, 0, "was able to swim across\n昨天：成功一次", "ev", null, null]]}], ["我昨天晚上看了一部很棒的電影。", "I watched a great movie last night.", "過去式搭配明確的過去時間（last night）。", {"v3": true, "legend": "key", "cap": "過去式：動作發生並結束在過去的某一個時間點，和現在切斷。", "rows": [[0, 0, 0, 0, "I watched a great movie\nlast night", "ev", null, null], [0, 0, 1, 1, "現在\n已經結束", "gray", null, null]]}], ["你一定累了，你從今天早上六點就一直在工作。", "You must be tired; you have been working since six this morning.", "must be：根據證據對「現在」的肯定推測（「一定是……」）。", {"v3": true, "legend": "perf", "cap": "完成進行式屬於持續型：從六點的起點（●）一路做到基準點「現在」（▶），當作證據，推出「簡單」層現在的狀態 must be（↑）。", "rows": [[0, 0, 1, 1, "You must be tired\n依證據推測現在", "ok", "u", null], [1, 2, 0, 1, "you have been working\n持續到基準點（六點起）", "ev", null, ">s"]]}], ["他一定是錯過火車了，因為他還沒到。", "He must have missed the train, because he is not here yet.", "must have + 過去分詞：對「過去」的肯定推測（「一定已經……」）。", {"v3": true, "legend": "key", "cap": "由現在的證據（簡單層），回頭推測過去已經發生的事：must + have + 過去分詞，放在「完成」層。", "rows": [[0, 0, 1, 1, "he is not here yet\n現在看到的證據", "ok", null, null], [2, 2, 0, 0, "must have missed the train\n推測過去的事", "hyp", "u", null]]}], ["電話響的時候，我正在洗澡。", "I was taking a shower when the phone rang.", "過去進行式（背景動作）+ 過去式（突然發生的事）。", {"v3": true, "legend": "key", "cap": "「進行」層的長條是一段正在進行的時間（洗澡，有起點、有終點）；上方「簡單」層的點（↓）是中途插進來的瞬間事件（電話響）。", "rows": [[0, 0, 0, 0, "the phone rang\n插進來的瞬間", "ev", null, "d"], [1, 1, 0, 0, "was taking a shower\n正在進行的一段時間", "ok", null, "b"]]}], ["那不可能是湯姆，他這個星期人在大阪。", "That cannot be Tom; he is in Osaka this week.", "cannot be：根據事實否定推測（「不可能是……」），與 must be 相反。", {"v3": true, "legend": "key", "cap": "根據現在的事實，否定現在的推測：cannot be（不可能是）。", "rows": [[0, 0, 1, 1, "he is in Osaka this week\n現在的事實", "ok", null, null], [0, 0, 1, 1, "That cannot be Tom\n依事實否定推測：不可能", "hyp", 1, null]]}], ["我還沒吃午餐。", "I haven't had lunch yet.", "現在完成式否定 + yet：到現在為止「還沒」。", {"v3": true, "legend": "perf", "cap": "結果型：「完成」層左邊是過去（吃午餐這個動作沒發生），線連到右邊「現在」的結果——到現在仍沒吃午餐（yet＝到現在仍沒有）。", "rows": [[2, 2, 0, 0, "had lunch\n過去：沒發生", "gray", null, "L"], [2, 2, 0, 1, "連到現在", "link", null, null], [2, 2, 1, 1, "還沒吃午餐\n現在的結果", "ok", null, "R"]]}], ["我已經住在這個城市十年了。", "I have lived in this city for ten years.", "現在完成式 + for + 一段期間：持續到現在的狀態。", {"v3": true, "legend": "perf", "cap": "持續型：「完成」層的長條從過去的起點（●）一路延伸到基準點「現在」（▶），沒有終點，表示狀態持續到現在。", "rows": [[0, 0, 1, 1, "現在\n基準點", "ref", null, null], [2, 2, 0, 1, "have lived in this city\n持續到基準點（十年前起）", "ok", null, ">s"]]}], ["自從搬到台中之後，我就一直在同一家公司上班。", "I have worked for the same company since I moved to Taichung.", "since + 過去的起點（用過去式），主句用現在完成式。", {"v3": true, "legend": "perf", "cap": "持續型：since 後接過去的起點（簡單層，過去式）；主句的現在完成式從那個起點（●）一路連到基準點「現在」（▶）。", "rows": [[0, 0, 0, 0, "I moved to Taichung\nsince 的起點", "ev", null, null], [0, 0, 1, 1, "現在\n基準點", "ref", null, null], [2, 2, 0, 1, "I have worked for the same company\n持續到基準點", "ev", 0, ">s"]]}], ["你認識他多久了？", "How long have you known him?", "How long + 現在完成式：問「持續了多久」。know 是狀態動詞，不用進行式。", {"v3": true, "legend": "perf", "cap": "持續型：現在完成式問 How long，問從開始認識（●）到基準點「現在」（▶）這一段有多久。", "rows": [[0, 0, 1, 1, "現在\n基準點", "ref", null, null], [2, 2, 0, 1, "you have known him\n持續到基準點：多久？", "ok", null, ">s"]]}], ["你學英文學多久了？", "How long have you been studying English?", "現在完成進行式：強調動作從過去持續到現在。", {"v3": true, "legend": "perf", "cap": "持續型的完成進行式：從開始學（●）到基準點「現在」（▶），強調「學」這個動作本身，而且仍在進行（跨「進行」與「完成」兩層）。", "rows": [[0, 0, 1, 1, "現在\n基準點", "ref", null, null], [1, 2, 0, 1, "you have been studying English\n持續到基準點，仍在進行", "ev", null, ">s"]]}], ["我去過京都兩次。", "I have been to Kyoto twice.", "have been to：曾經去過（經驗），人已經回來。", {"v3": true, "legend": "perf", "cap": "結果型：「完成」層左邊是過去的一個動作（去過京都兩次，也回來了），線連到右邊「現在」的結果：留下「去過京都」的經驗，人已經回來。", "rows": [[2, 2, 0, 0, "went to Kyoto ×2\n過去的動作", "ev", null, "Lo"], [2, 2, 0, 1, "連到現在", "link", null, null], [2, 2, 1, 1, "去過京都\n現在：有經驗", "ok", null, "R"]]}], ["他去日本了，所以這個星期不在這裡。", "He has gone to Japan, so he is not here this week.", "have gone to：已經去了（人現在不在這裡）。與 have been to 對比。", {"v3": true, "legend": "perf", "cap": "結果型：have gone to＝過去出發了（●），結果連到現在：人還在日本，所以這星期不在這裡。（與 have been to 比較：人已經回來。）", "rows": [[2, 2, 0, 0, "went to Japan\n過去：出發", "ev", null, "Lo"], [2, 2, 0, 1, "連到現在", "link", null, null], [2, 2, 1, 1, "人在日本\n現在的結果", "ok", null, "R"]]}], ["這家店已經不再賣紙本雜誌了。", "This store no longer sells paper magazines.", "no longer + 動詞：「已不再……」，表示狀態的改變。", {"v3": true, "legend": "key", "cap": "no longer：以前是這樣（灰），從現在起不再是了（綠）。", "rows": [[0, 0, 0, 0, "以前：sold paper magazines", "gray", null, "-"], [0, 0, 1, 2, "no longer sells paper magazines\n現在起不再賣", "ok", null, ">"]]}], ["我今晚會工作到十點，這樣明天早上以前就能把檔案寄給你。", "I will work until ten tonight, so I can send you the file by tomorrow morning.", "until 表示動作「持續到」某時；by 表示「在某時之前」完成（期限）。", {"v3": true, "legend": "key", "cap": "until＝一直持續到某時（長條：工作到今晚十點）；by＝在某時之前完成（期限，黃色：明早（tomorrow morning）以前把檔案寄出）。", "rows": [[0, 0, 1, 2, "I will work until ten tonight\n持續到今晚十點", "ev", null, "b"], [0, 0, 2, 2, "send you the file by\n明早以前完成", "ref", null, null]]}], ["我以前每天騎腳踏車上學，現在改搭捷運。", "I used to ride a bike to school every day, but now I take the MRT.", "used to + 原形：過去的習慣，現在已不是如此。", {"v3": true, "legend": "key", "cap": "used to：過去的習慣（長條：每天騎腳踏車上學，ride a bike to school），現在已經不是了；後半句用現在式說現在的習慣。", "rows": [[0, 0, 0, 0, "used to ride a bike\n過去的習慣", "gray", null, "b"], [0, 0, 1, 1, "now I take the MRT\n現在的習慣", "ok", null, null]]}], ["明天我要跟朋友見面。", "I am meeting a friend tomorrow.", "現在進行式表示已安排好的近期計畫。", {"v3": true, "legend": "key", "cap": "現在進行式（「進行」層）表示未來的安排：現在已經約好，事情發生在明天。", "rows": [[1, 1, 1, 1, "I am meeting\n現在：已經約好", "ok", null, null], [1, 1, 2, 2, "a friend tomorrow\n明天見面", "ev", 1, null]]}], ["我打算明年出國念書，我已經申請了兩所學校。", "I am going to study abroad next year; I have already applied to two schools.", "be going to：事先決定好的計畫（通常已有準備或跡象）；與第 27 句的 will 對比。", {"v3": true, "legend": "perf", "cap": "be going to：事先決定的計畫，現在已有準備（「完成」層是結果型：已申請兩所學校，結果連到現在：所以早有準備），事情在未來。", "rows": [[0, 0, 1, 1, "I am going to…\n現在：已經決定", "ok", null, null], [0, 0, 2, 2, "study abroad next year\n未來：執行", "ev", 1, null], [2, 2, 0, 0, "applied\n過去：已申請", "ev", null, "Lo"], [2, 2, 0, 1, "連到現在", "link", null, null], [2, 2, 1, 1, "已申請了\n現在的結果", "ok", null, "R"]]}], ["啊，牛奶沒了。我現在去買一些。", "Oh, we are out of milk. I will go and buy some now.", "will：說話當下才臨時決定的事；與第 26 句的 be going to（事先計畫）對比。", {"v3": true, "legend": "key", "cap": "will：說話的當下才決定，之前沒有計畫；事情發生在決定之後的未來。", "rows": [[0, 0, 1, 1, "we are out of milk\n現在：剛發現，當場決定", "ok", null, null], [0, 0, 2, 2, "I will go and buy some now\n決定之後的行動", "ev", 1, null]]}], ["你到家的時候，請打電話給我。", "Please call me when you get home.", "時間副詞子句用現在式代替未來（when you get，不是 will get）。", {"v3": true, "legend": "key", "cap": "when 引導的時間子句用現在式代表未來；兩件事都在未來，先到家、再打電話。", "rows": [[0, 0, 2, 2, "you get home\nwhen：現在式代表未來", "ref", null, null], [0, 0, 2, 2, "call me\n之後", "ev", 2, null]]}], ["你一寫完報告，就可以回家了。", "Once you have finished the report, you can go home.", "「～之後／一……就」：once / after + 完成式或現在式。與第 7 句的 if（假如）、第 28 句的 when（……的時候）對照，三種「～したら」。", {"v3": true, "legend": "key", "cap": "once 子句用現在完成式（「完成」層），表示「到未來那個時間點已經完成」；完成之後（↑）才能回家。", "rows": [[0, 0, 2, 2, "you can go home\n之後", "ev", "u", null], [2, 2, 2, 2, "have finished the report\nonce：先完成", "ref", null, null]]}], ["我一寫完報告就寄給你。", "I will send you the report as soon as I finish it.", "as soon as 子句用現在式；主句用 will。", {"v3": true, "legend": "key", "cap": "as soon as 子句用現在式代表未來；它一發生，主句 will 的動作就緊接著發生。", "rows": [[0, 0, 2, 2, "I finish it\nas soon as：現在式", "ref", null, null], [0, 0, 2, 2, "I will send you the report\n緊接著", "ev", 2, null]]}], ["到明年三月，我在這家公司就工作滿五年了。", "By next March, I will have worked at this company for five years.", "未來完成式：到未來某時間點為止的「累積」或「完成」。", {"v3": true, "legend": "perf", "cap": "未來完成式放在「完成」層：先標出未來的基準點（next March），工作從過去的起點（●）累積，到那個基準點為止（▶）滿五年。", "rows": [[0, 0, 2, 2, "By next March\n未來的基準點", "ref", null, null], [2, 2, 0, 2, "I will have worked at this company for five years\n從過去累積，到基準點為止", "ev", null, ">s"]]}], ["他說他前一天很忙。", "He said he had been busy the day before.", "間接敘述中，比說話時更早的事用過去完成式；yesterday 要改成 the day before。", {"v3": true, "legend": "key", "cap": "轉述：以「說話的那一刻」（He said…）為基準點，放在簡單層；他「忙」的時間比說話更早（the day before＝前一天），所以用 had + 過去分詞，放在「完成」層（過去的過去）。", "rows": [[0, 0, 0, 0, "He said…\n基準點：說話時", "ref", null, null], [2, 2, 0, 0, "he had been busy\n更早：前一天", "ev", null, "u"]]}], ["我到車站的時候，火車已經開走了。", "When I got to the station, the train had already left.", "過去完成式：比「過去某一時間點」更早發生的事。", {"v3": true, "legend": "key", "cap": "過去完成式放在「完成」層：先在「簡單」層標出過去的基準點（到車站的那一刻），火車的動作在它之前就已經完成了（↑）。", "rows": [[0, 0, 0, 0, "I got to the station\n基準點：到站", "ref", null, null], [2, 2, 0, 0, "the train had already left\n更早就開走了", "ev", null, "u"]]}], ["一開始我以為這部電影很無聊，但結尾時我多年來第一次哭了。", "At first I thought the movie was boring, but at the end I cried for the first time in years.", "at first：「起初」（之後情況有變）；for the first time：「第一次」。兩者意思不同。", {"v3": true, "legend": "key", "cap": "at first＝起初（後來情況改變）；for the first time＝某件事第一次發生。兩者都在過去而且有先後：先是起初覺得無聊（thought the movie was boring），到了結尾（at the end）才多年來第一次哭了（cried … in years）。", "rows": [[0, 0, 0, 0, "At first\n起初：覺得無聊", "gray", null, null], [0, 0, 0, 0, "cried for the first time\n結尾：第一次哭", "ev", 0, null]]}], ["她告訴我她隔天會來。", "She told me that she would come the next day.", "過去式動詞後的 will 變成 would；tomorrow 改成 the next day。", {"v3": true, "legend": "key", "cap": "轉述中的 would＝will 的過去式：以「她說話的那一刻」（She told me）為基準（簡單層），從那時往後看到的未來（過去的未來），也就是隔天（the next day）。", "rows": [[0, 0, 0, 0, "She told me\n基準點：說話時", "ref", null, null], [0, 0, 0, 0, "she would come\n過去的未來", "hyp", 0, null]]}], ["我不知道他什麼時候會到。", "I don't know when he will arrive.", "名詞子句（know 的受詞）可以用 will；與時間副詞子句不同，請比較第 28 句。", {"v3": true, "legend": "key", "cap": "when 在這裡是 know 的受詞（名詞子句），不是時間副詞子句，所以未來仍用 will。", "rows": [[0, 0, 1, 1, "I don't know\n現在", "ok", null, null], [0, 0, 2, 2, "he will arrive\n未來：保留 will", "ev", 1, null]]}], ["她平常穿制服，但今天她穿的是洋裝。", "She usually wears a uniform, but today she is wearing a dress.", "wear：穿著的習慣；be wearing：此刻身上穿著的狀態。", {"v3": true, "legend": "key", "cap": "wears（「簡單」層）＝一貫的習慣，橫跨整條時間軸；is wearing（「進行」層）＝此刻身上的狀態（現在這一點）。", "rows": [[0, 0, 0, 2, "she usually wears a uniform\n習慣：過去、現在、未來都是", "ok", null, "-"], [1, 1, 1, 1, "today she is wearing a dress\n此刻的狀態", "ev", null, null]]}], ["天氣很冷，所以我出門前穿上了外套。", "It was cold, so I put on my coat before I went out.", "put on：「穿上」的動作；與 wear（穿著的狀態）不同。", {"v3": true, "legend": "key", "cap": "put on＝穿上的動作（簡單層的點），穿上之後才出門（before I went out）；穿上以後就處於 wear 的狀態（「進行」層的長條，直到出門）。", "rows": [[0, 0, 0, 0, "put on my coat\n動作：穿上", "ev", null, null], [0, 0, 0, 0, "before I went out\n之後：出門", "ref", 0, null], [1, 1, 0, 0, "wearing it\n狀態：穿著", "ok", null, "b"]]}], ["如果你今晚有空，我們去看電影吧。", "If you are free tonight, let's go see a movie.", "if 子句用現在式表示未來的可能情況，後面可接祈使句或 let's。", {"v3": true, "legend": "key", "cap": "真實的條件：今晚是未來，if 子句仍用現在式；結果句直接用 let's（建議）。", "rows": [[0, 0, 2, 2, "you are free tonight\nif：現在式代表未來", "ev", null, null], [0, 0, 2, 2, "let's go see a movie\n結果：建議", "ev", 2, null]]}], ["我當時應該聽你的建議。", "I should have taken your advice at that time.", "should have + 過去分詞：對過去的事感到後悔、「早該……」。", {"v3": true, "legend": "key", "cap": "should have + 過去分詞（「完成」層）：站在現在回頭看，當時沒做到的事，表示後悔或批評。", "rows": [[0, 0, 1, 1, "現在\n感到後悔", "ok", null, null], [2, 2, 0, 0, "should have taken your advice\n當時沒做到", "hyp", "u", null]]}]]}, {"id": "part2", "title": "第二部分：邏輯", "range": "041–064", "desc": "原因與結果、對比、比較、讓步、強調與一般化。", "items": [["因為下大雨，我們取消了野餐。", "We canceled the picnic because it rained heavily.", "because 引導原因子句；注意 because 與 so 不能同句並用（不要寫 Because ..., so ...）。"], ["他整晚沒睡，結果上課時睡著了。", "He stayed up all night; as a result, he fell asleep in class.", "as a result：用副詞片語連接「結果」，前面用分號或句號。"], ["好習慣能節省時間。例如，前一天晚上先準備好衣服，早上就會輕鬆很多。", "Good habits save time. For example, preparing your clothes the night before makes the morning much easier.", "先說抽象的主張，再用 For example 舉具體例子支持。"], ["雖然這家餐廳很小，但是食物很好吃。", "Although the restaurant is small, the food is delicious.", "although 連接讓步子句；英文中不能再加 but。"], ["這個計畫很有趣；不過，它的成本太高了。", "The plan is interesting; however, it costs too much.", "however：副詞，前面用分號或句號，後面加逗號。"], ["我哥哥喜歡運動，而我弟弟比較喜歡看書。", "My older brother likes sports, while my younger brother prefers reading.", "while 表示兩者的「對比」。"], ["光是因為他很年輕，並不代表他沒有經驗。", "Just because he is young doesn't mean he has no experience.", "Just because A doesn't mean B：不能因為 A 就推論 B。"], ["有錢不一定就會快樂。", "Being rich does not always make people happy.", "not always：部分否定，「不一定」，不等於 never。"], ["這個問題比我想像的還要難。", "This problem is more difficult than I thought.", "比較級 + than + 子句：把現實與預期做比較。"], ["學生花在閱讀上的時間比以前少了。", "Students spend less time reading than they used to.", "less ... than：「比較少」；than they used to 省略了重複的動詞。"], ["練習得越多，你就會越有自信。", "The more you practice, the more confident you will become.", "The + 比較級, the + 比較級：「越……就越……」。"], ["台北的物價沒有東京那麼高。", "Prices in Taipei are not as high as those in Tokyo.", "not as ... as：「不像……那麼……」；those 代替 prices，避免重複。"], ["我認為學生應該學寫程式，因為這能培養邏輯思考。", "I think students should learn programming because it develops logical thinking.", "寫意見的基本結構：主張 + because + 理由。"], ["我反對在課堂上使用手機，理由有兩個。", "I am against using phones in class for two reasons.", "be against 後面接 ～ing；for two reasons 先說明理由有幾個。"], ["雖然搭捷運比較貴，我還是比較喜歡，因為它比較準時。", "Even though the MRT is more expensive, I still prefer it because it is more punctual.", "even though + 讓步，主句用 still 強調態度；最後再補上理由。"], ["直到上個月，我們才發現這個錯誤。", "It was not until last month that we noticed the mistake.", "It is not until ... that ...：「直到……才……」的強調句型。"], ["光靠背單字，並不足以把英文學好。", "Memorizing vocabulary alone is not enough to learn English well.", "not enough：條件「不充分」；動名詞可以當主詞。"], ["要通過考試，努力是必要的，但並不保證成功。", "Hard work is necessary to pass the exam, but it does not guarantee success.", "necessary（必要條件）與 guarantee（充分條件）的區別。"], ["一般來說，年輕人每天都會用社群媒體，但也有一些例外。", "In general, young people use social media every day, but there are some exceptions.", "In general 先說一般情況，but there are some exceptions 再補充例外。"], ["最重要的是睡眠的品質，而不是睡了多久。", "It is the quality of sleep, not the length, that matters most.", "It is A, not B, that ...：強調句型，強調 A。"], ["科技可以讓學習更有彈性。比方說，學生有空的時候就能看錄好的課程。", "Technology can make learning more flexible. For instance, students can watch recorded lessons whenever they have time.", "先說抽象的結論，再用 For instance 具體說明；whenever = 在任何……的時候。"], ["她不只會說英文，也會說日文。", "She can speak not only English but also Japanese.", "not only A but also B：A 與 B 的詞性、結構要對稱。"], ["天氣不但很冷，而且還下起雨來了。", "Not only was it cold, but it also began to rain.", "Not only 放句首時，後面的主詞與動詞倒裝。"], ["因此，我們在網路上發文時必須更加小心。", "Therefore, we need to be more careful about what we post online.", "therefore：用來導出結論；what we post 是名詞子句。"]]}, {"id": "part3", "title": "第三部分：句子的組裝", "range": "065–081", "desc": "想清楚誰對誰說什麼，再決定主詞與句型。", "items": [["這支手機讓我可以在任何地方工作。", "This phone enables me to work anywhere.", "無生命主詞 + enable A to ...：「使 A 能夠……」。"], ["我們老師允許我們在考試時使用字典。", "Our teacher allowed us to use dictionaries during the exam.", "allow A to ...：「允許 A 做……」。"], ["這首歌讓我想起高中時代。", "This song reminds me of my high school days.", "remind A of B：「讓 A 想起 B」。"], ["他的笑話讓我們全都笑了。", "His joke made us all laugh.", "make A + 原形動詞：「使 A 做……」（使役）。"], ["我哥哥提醒我要帶鑰匙。", "My brother reminded me to bring my key.", "remind A to ...：「提醒 A 要做……」。與 remind A of B 區別。"], ["我家有四個人。", "There are four people in my family.", "中文的「有」常用 There is / are 表達「存在」。"], ["今天很熱。", "It is very hot today.", "描述天氣、時間、氣溫時，用 it 當主詞。"], ["睡眠充足很重要。", "It is important to get enough sleep.", "形式主詞 it + 真主詞 to ...：避免頭重腳輕。"], ["這座橋是在1990年建造的。", "This bridge was built in 1990.", "被動語態：重點在「橋」而非「誰建造」，施事者不重要時使用。"], ["這個故事是我從奶奶那裡聽來的。", "I heard this story from my grandmother.", "中文帶有被動感的句子，英文常改用主動，以「我」當主詞。"], ["他突然離開，讓我很驚訝。", "I was surprised that he left so suddenly.", "避免名詞化：把「他的突然離開」還原成子句，更自然。"], ["牛奶壞掉了，因為我昨晚把它放在冰箱外面。", "The milk went bad because I left it outside the fridge overnight.", "go + 形容詞：「變得（不好的狀態）」，如 go bad、go wrong；come + 形容詞則多為好的變化，如 come true。"], ["我昨天買的那本書很有趣。", "The book I bought yesterday is interesting.", "關係代名詞（受格）可以省略：the book (that) I bought。"], ["在台灣幾乎到處都能用手機付款，不過我爺爺還是用現金。", "You can pay by phone almost anywhere in Taiwan, but my grandfather still uses cash.", "泛指的一般人用 you（we、people 亦可）；指特定的人才用 I、he、my grandfather。"], ["我有一個朋友，他的爸爸是老師。", "I have a friend whose father is a teacher.", "whose + 名詞：表示所屬，「……的」。"], ["我叔叔上個月買了一輛小小的黑色日本車。", "My uncle bought a small black Japanese car last month.", "名詞前的形容詞順序：大小 → 顏色 → 國籍／產地 → 名詞。"], ["這本書是用簡單的英文寫的，所以很適合初學者閱讀。", "Written in simple English, this book is easy for beginners to read.", "過去分詞構句：Written in ... 相當於 Becaus }

// ---- diff ----
function tokens(s){
  return s.replace(/[\u2018\u2019]/g,"'").replace(/[.,!?;:"“”]/g," ").trim().split(/\s+/).filter(Boolean);
}
function norm(w){return w.toLowerCase();}
function diffHtml(answer,target){
  var a=tokens(answer),b=tokens(target);
  var m=a.length,k=b.length,dp=[],i,j;
  for(i=0;i<=m;i++){dp.push(new Array(k+1).fill(0));}
  for(i=m-1;i>=0;i--)for(j=k-1;j>=0;j--){
    dp[i][j]=norm(a[i])===norm(b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  }
  var you=[],ans=[];i=0;j=0;
  while(i<m&&j<k){
    if(norm(a[i])===norm(b[j])){you.push('<span class="m">'+esc(a[i])+'</span>');ans.push('<span class="m">'+esc(b[j])+'</span>');i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){you.push('<span class="x">'+esc(a[i])+'</span>');i++;}
    else{ans.push('<span class="e">'+esc(b[j])+'</span>');j++;}
  }
  while(i<m){you.push('<span class="x">'+esc(a[i])+'</span>');i++;}
  while(j<k){ans.push('<span class="e">'+esc(b[j])+'</span>');j++;}
  var same=a.length===b.length&&a.every(function(w,x){return norm(w)===norm(b[x]);});
  return {same:same,you:you.join(" "),ans:ans.join(" ")};
}

      '<div class="acts"><button class="sp">🔊 朗讀</button><button class="mk'+(d?" ok":"")+'">'+(d?"✓ 已記住":"標記為已記住")+'</button></div>';
    var en=c.querySelector(".en");
    en.onclick=function(){if(store.hideEn){en.classList.toggle("hid");var tl=c.querySelector(".tl");if(tl)tl.classList.toggle("hid",en.classList.contains("hid"));}};
    c.querySelector(".sp").onclick=function(){speak(x.en);};
    c.querySelector(".mk").onclick=function(){toggle(x.n);render();};
    v.appendChild(c);
  });
}
function toggle(k){if(store.mastered[k])delete store.mastered[k];else store.mastered[k]=true;save();}
function renderPractice(){
  var v=$("view");v.innerHTML="";
  var dk=deck();
  if(!dk.length){v.innerHTML='<div class="empty">這個範圍沒有句子可練習。<br>試試把篩選改成「全部」。</div>';return;}
  if(st.idx>=dk.length)st.idx=0;
  var x=dk[st.idx];var d=!!store.mastered[x.n];
  var c=document.createElement("div");c.className="card"+(d?" done":"");
  var h='<div class="no">第 '+(st.idx+1)+' / '+dk.length+' 題・'+pad(x.n)+'・'+esc(DATA[x.part].title.split("：")[1])+(d?'・已記住':'')+'</div>'+
    '<div class="zh">'+esc(x.zh)+'</div>'+
    '<textarea id="ans" placeholder="（選填）在這裡輸入你的英文翻譯" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>'+
    '<div class="acts"><button id="chk" class="primary">檢查答案</button><button id="rev">顯示答案</button></div><div id="res"></div>';
  c.innerHTML=h;v.appendChild(c);
  var ta=$("ans");ta.value=st.typed;
  ta.oninput=function(){st.typed=ta.value;};
  var res=$("res");
  function showAnswer(withDiff){
    var html="";
    if(withDiff){
      var r=diffHtml(st.typed,x.en);
      if(r.same)html+='<div class="msg" style="color:var(--ok)">✓ 完全正確（忽略大小寫與標點）</div>';
      else html+='<div class="msg">你的答案（紅色＝多餘或錯誤）：</div><div class="diff">'+(r.you||"（空白）")+'</div><div class="msg">參考答案（黃色＝你漏掉的字）：</div><div class="diff">'+r.ans+'</div>';
    }else{
      html+='<div class="msg">參考答案：</div><div class="en">'+esc(x.en)+'</div>';
    }
    if(x.tl&&store.showTl)html+=tlHtml(x.tl,"");
    html+='<div class="pt">重點：'+esc(x.pt)+'</div><div class="acts"><button id="sp">🔊 朗讀</button><button id="mk" class="'+(d?"ok":"")+'">'+(d?"✓ 已記住（點擊取消）":"我記住了")+'</button></div>';
    res.innerHTML=html;
    $("sp").onclick=function(){speak(x.en);};
    $("mk").onclick=function(){toggle(x.n);var wasDone=!!store.mastered[x.n];if(wasDone&&st.filter==="todo"){/* stay on card */}render2(true);};
    if(store.autoSpeak)speak(x.en);
  }
  function render2(keep){updateTop();var cur=!!store.mastered[x.n];c.className="card"+(cur?" done":"");d=cur;showAnswer(st.checked==="diff");}
  $("chk").onclick=function(){
    if(!st.typed.trim()){res.innerHTML='<div class="msg">請先輸入答案，或按「顯示答案」。</div>';return;}
    st.revealed=true;st.checked="diff";showAnswer(true);
  };
  $("rev").onclick=function(){st.revealed=true;st.checked="plain";showAnswer(false);};
  if(st.revealed)showAnswer(st.checked==="diff");
  var nav=document.createElement("div");nav.className="nav";
  nav.innerHTML='<button id="prev">← 上一題</button><button id="shuf">🔀 打亂順序</button><button id="next" class="primary">下一題 →</button>';
  v.appendChild(nav);
  $("prev").onclick=function(){st.idx=(st.idx-1+dk.length)%dk.length;resetCard();render();};
  $("next").onclick=function(){st.idx=(st.idx+1)%dk.length;resetCard();render();};
  $("shuf").onclick=function(){shuffle();render();};
  var tip=document.createElement("div");tip.className="msg";tip.style.color="var(--sub)";
  tip.textContent="提示：把篩選設為「未記住」再按「打亂順序」，就能只複習還沒記住的句子。";
  v.appendChild(tip);
}
function render(){updateTop();if(st.mode==="list")renderList();else renderPractice();}

Array.prototype.forEach.call(document.querySelectorAll("#modes button"),function(b){b.onclick=function(){st.mode=b.getAttribute("data-m");resetCard();render();};});
Array.prototype.forEach.call(document.querySelectorAll("#filters button"),function(b){b.onclick=function(){st.filter=b.getAttribute("data-f");st.order=null;st.idx=0;resetCard();render();};});
$("hideEn").checked=!!store.hideEn;$("autoSpeak").checked=!!store.autoSpeak;$("showTl").checked=store.showTl!==false;$("rate").value=store.rate;
$("showTl").onchange=function(){store.showTl=this.checked;save();render();};
$("hideEn").onchange=function(){store.hideEn=this.checked;save();render();};
$("autoSpeak").onchange=function(){store.autoSpeak=this.checked;save();};
$("rate").onchange=function(){store.rate=this.value;save();};
$("resetBtn").onclick=function(){if(confirm("確定要清除全部「已記住」的進度嗎？")){store.mastered={};save();st.order=null;resetCard();render();}};
function ioMsg(t,bad){var m=$("ioMsg");m.textContent=t;m.style.color=bad?"var(--bad)":"var(--ok)";}
$("exportBtn").onclick=function(){
  try{
    var list=Object.keys(store.mastered).filter(function(k){return store.mastered[k];}).map(Number).sort(function(a,b){return a-b;});
    var payload={app:"basic-english-100",version:1,exportedAt:new Date().toISOString(),mastered:list,settings:{hideEn:!!store.hideEn,autoSpeak:!!store.autoSpeak,showTl:store.showTl!==false,rate:store.rate}};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var a=document.createElement("a");var url=URL.createObjectURL(blob);
    var dt=new Date(),p2=function(x){return ("0"+x).slice(-2);};
    a.href=url;a.download="basic-english-100-progress-"+dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    ioMsg("已匯出 "+list.length+" 句的進度。");
  }catch(e){ioMsg("匯出失敗："+e.message,true);}
};
$("importBtn").onclick=function(){$("importFile").click();};
$("importFile").onchange=function(){
  var f=this.files&&this.files[0];var inp=this;if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||o.app!=="basic-english-100"||!Array.isArray(o.mastered))throw new Error("這不是本程式匯出的進度檔");
      var m={},c=0;
      o.mastered.forEach(function(k){k=Number(k);if(k>=1&&k<=100&&Math.floor(k)===k){m[k]=true;}});
      c=Object.keys(m).length;
      if(!confirm("將以檔案內容（已記住 "+c+" 句）取代目前的進度，確定嗎？")){inp.value="";return;}
      store.mastered=m;
      if(o.settings){
        store.hideEn=!!o.settings.hideEn;store.autoSpeak=!!o.settings.autoSpeak;
        if(typeof o.settings.showTl==="boolean"){store.showTl=o.settings.showTl;$("showTl").checked=store.showTl;}
        if(["0.7","0.9","1.1"].indexOf(String(o.settings.rate))>=0)store.rate=String(o.settings.rate);
        $("hideEn").checked=store.hideEn;$("autoSpeak").checked=store.autoSpeak;$("rate").value=store.rate;
      }
      save();st.order=null;resetCard();render();
      ioMsg("已匯入，已記住 "+c+" 句。");
    }catch(e){ioMsg("匯入失敗："+e.message,true);}
    inp.value="";
  };
  r.onerror=function(){ioMsg("讀取檔案失敗。",true);inp.value="";};
  r.readAsText(f);
};
showWarn();
$("ttsNote").textContent=tts?"朗讀使用瀏覽器內建語音（speechSynthesis），可離線使用，聲音依裝置而異。":"此瀏覽器不支援語音朗讀。";
if(!tts){var sp=document.getElementById("autoSpeak");sp.disabled=true;}
render();
window.__app={all:all,store:store,st:st,render:render};
})();
</script>
</body>
</html>
